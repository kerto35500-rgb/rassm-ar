<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- أيقونة «وحدة!» للصفحة الرئيسية: ثلاث بطاقاتٍ مروحيّة بستايل المارشميلو.
       مرسومة من الصفر (لا صلة لها بأصول اللعبة الأصلية). -->
  <defs>
    <linearGradient id="blu" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7FCFF2"/><stop offset="1" stop-color="#3F9FD8"/>
    </linearGradient>
    <linearGradient id="yel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD966"/><stop offset="1" stop-color="#F2B72E"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F4776E"/><stop offset="1" stop-color="#D93F3C"/>
    </linearGradient>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.6" flood-color="#000" flood-opacity=".28"/>
    </filter>
  </defs>

  <g filter="url(#sh)">
    <!-- البطاقة الخلفية: زرقاء مائلة لليسار -->
    <g transform="rotate(-20 64 74)">
      <rect x="26" y="26" width="52" height="76" rx="11"
            fill="url(#blu)" stroke="#fff" stroke-width="6"/>
      <ellipse cx="52" cy="64" rx="17" ry="26" fill="#fff" opacity=".28"
               transform="rotate(-20 52 64)"/>
    </g>

    <!-- البطاقة الوسطى: صفراء -->
    <g transform="rotate(-2 64 74)">
      <rect x="38" y="20" width="52" height="76" rx="11"
            fill="url(#yel)" stroke="#fff" stroke-width="6"/>
      <ellipse cx="64" cy="58" rx="17" ry="26" fill="#fff" opacity=".3"
               transform="rotate(-20 64 58)"/>
    </g>

    <!-- البطاقة الأمامية: حمراء عليها «١» -->
    <g transform="rotate(17 64 74)">
      <rect x="50" y="24" width="54" height="78" rx="11"
            fill="url(#red)" stroke="#fff" stroke-width="6"/>
      <ellipse cx="77" cy="63" rx="19" ry="28" fill="#fff"
               transform="rotate(-20 77 63)"/>
      <text x="77" y="63" text-anchor="middle" dominant-baseline="central"
            font-family="'Segoe UI', Tahoma, Arial, sans-serif"
            font-size="40" font-weight="900" fill="#D93F3C"
            transform="rotate(-20 77 63)">١</text>
    </g>
  </g>
</svg>
