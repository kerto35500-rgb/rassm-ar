<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>🚪 مختبر حركات الباب — قمّة الهرم</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/* ═══ مختبر تجارب دخول الباب — كل الحركات بـ Web Animations API
   (لا تتأثر بوضع «تقليل الحركة» في الجهاز) ═══ */
:root{
  --bg:#efe9fb; --card:#faf8ff; --ink:#3d2b63; --dim:#8b7fae;
  --v:#8b5cf6; --vd:#6d3ff0; --gold:#ffcb2e; --pink:#ff2f8e; --cyan:#22b8e6;
  --stroke:#d6c9f2;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:linear-gradient(170deg,#f3edfd,#e9e0fa 60%,#e2d6f8);
  font-family:"Baloo Bhaijaan 2",system-ui,sans-serif;color:var(--ink);
  display:flex;flex-direction:column;overflow:hidden}

/* ─── الرأس ─── */
header{flex:0 0 auto;text-align:center;padding:14px 12px 6px}
header h1{margin:0;font-size:clamp(19px,4.5vw,27px);font-weight:800;color:var(--vd)}
header p{margin:4px 0 0;font-size:12.5px;color:var(--dim)}

/* ─── أزرار الحركات ─── */
#bar{flex:0 0 auto;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:10px 12px}
.mv{border:2px solid var(--stroke);background:var(--card);color:var(--ink);cursor:pointer;
  border-radius:16px;padding:9px 14px;font-family:inherit;font-weight:800;font-size:13.5px;
  box-shadow:0 4px 0 var(--stroke);transition:transform .12s, box-shadow .12s}
.mv small{display:block;font-weight:600;font-size:10.5px;color:var(--dim)}
.mv:hover{transform:translateY(-2px)}
.mv:active{transform:translateY(2px);box-shadow:0 1px 0 var(--stroke)}
.mv:disabled{opacity:.45;pointer-events:none}
.mv .n{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:7px;
  background:var(--v);color:#fff;font-size:12px;margin-inline-end:5px}

/* ─── المسرح ─── */
#stageWrap{flex:1;min-height:0;position:relative;padding:8px 14px 14px}
#stage{position:relative;height:100%;border-radius:26px;overflow:hidden;
  background:linear-gradient(180deg,#f7f3ff,#efe7fd);border:2px solid var(--stroke);
  box-shadow:inset 0 2px 12px rgba(109,63,240,.06)}
#world{position:absolute;inset:0;display:grid;grid-template-columns:1fr 1fr;
  gap:clamp(10px,2.5vmin,22px);padding:clamp(12px,3vmin,26px);will-change:transform}

/* ─── الباب (نفس روح أبواب اللعبة) ─── */
.door{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:0;will-change:transform,opacity;
  --p1:color-mix(in srgb,var(--c1) 58%,#fff);
  --p2:color-mix(in srgb,var(--c2) 55%,#fff);
  --pd:color-mix(in srgb,var(--c2) 70%,#42305c)}
.arch{position:relative;width:min(86%,270px);height:92%;max-height:340px;
  border-radius:130px 130px 18px 18px;overflow:hidden;
  border:3px solid var(--c2);background:var(--c2);
  box-shadow:0 14px 28px -14px rgba(61,43,99,.45), inset 0 2px 0 rgba(255,255,255,.5);
  perspective:900px}
.inner{position:absolute;inset:7px;border-radius:118px 118px 12px 12px;overflow:hidden;
  background:radial-gradient(120% 90% at 50% 10%,#fff8e8,#ffe9a8 45%,#ffd75e);
  display:grid;place-items:center}
.glow{position:absolute;inset:0;background:radial-gradient(60% 50% at 50% 45%,rgba(255,255,255,.95),rgba(255,230,150,0) 70%)}
.panel{position:absolute;inset:7px;border-radius:118px 118px 12px 12px;overflow:hidden;z-index:5;
  background:transparent;pointer-events:none;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;
  backface-visibility:hidden;will-change:transform}
.panel .em{font-size:clamp(26px,6vmin,44px);filter:drop-shadow(0 3px 6px rgba(60,40,90,.3));
  margin-bottom:2%}
.panel .tt{font-size:clamp(13px,3vmin,17px);font-weight:800;color:var(--pd,#5a4a80);
  background:rgba(255,255,255,.94);padding:3px 15px;border-radius:99px;
  box-shadow:0 3px 8px -3px rgba(60,40,90,.35)}
.panel .knob{display:none}
/* ═══ مصراعا الباب — ظاهران دائماً: كل ستايل باب حقيقي منقسم نصفين ═══ */
.half{position:absolute;top:var(--fp,8px);bottom:var(--fp,8px);width:calc(50% - var(--fp,8px));
  overflow:hidden;backface-visibility:hidden;will-change:transform;z-index:2}
.half.R{right:var(--fp,8px);transform-origin:right center;
  border-radius:0 var(--rt,104px) var(--rb,12px) 0}
.half.L{left:var(--fp,8px);transform-origin:left center;
  border-radius:var(--rt,104px) 0 0 var(--rb,12px)}
.half i{position:absolute;top:0;bottom:0;width:200%;display:block;
  background:linear-gradient(180deg,var(--p1),var(--p2))}
.half.R i{right:0}.half.L i{left:0}
/* لوح غائر داخل كل مصراع */
.half i::before,.half i::after{content:"";position:absolute;top:17%;bottom:15%;border-radius:14px;
  background:rgba(255,255,255,.16);
  box-shadow:inset 0 3px 8px rgba(0,0,0,.14), inset 0 -2px 0 rgba(255,255,255,.3)}
.half i::before{left:10%;right:57%}
.half i::after{left:57%;right:10%}
/* خط المنتصف: ظل على المصراع الأيمن ولمعة على الأيسر — يتحركان مع المصراعين */
.half.R::before{content:"";position:absolute;left:0;top:2%;bottom:2%;width:2px;
  background:rgba(60,40,90,.25);z-index:3}
.half.L::after{content:"";position:absolute;right:0;top:2%;bottom:2%;width:1.5px;
  background:rgba(255,255,255,.4);z-index:3}
/* مقبضان متقابلان عند خط المنتصف */
.half .knb{position:absolute;top:52%;width:13px;height:13px;border-radius:50%;z-index:4;
  background:radial-gradient(circle at 35% 35%,#fff,#ffe9a3 45%,#c9a24e);
  box-shadow:0 2px 4px rgba(0,0,0,.28), inset 0 1px 0 rgba(255,255,255,.7)}
.half.R .knb{left:9px}.half.L .knb{right:9px}
.halfEm{display:none}

/* ═══════════ عشرة ستايلات باب بمصراعين — كيوت مارشميلو ═══════════
   كل ستايل يحدد: الإطار (.arch) وخشب المصراعين (.half i) وألواحهما
   (i::before/i::after) والمقبضين (.knb) — البنية بابٌ حقيقي دائماً. */

/* ست١ · مارشميلو كلاسيك — قوس كريمي ومصراعان باستيل بلوحين غائرين */
body.st-1 .arch{--fp:9px;border:none;padding:0;border-radius:120px 120px 26px 26px;
  background:linear-gradient(180deg,#ffffff,#f1eaff);
  box-shadow:0 20px 32px -18px rgba(109,63,240,.4), 0 6px 0 -3px #e3d7ff, inset 0 3px 0 #fff}
body.st-1 .inner{inset:9px;border-radius:110px 110px 18px 18px}
body.st-1 .half.L{border-radius:110px 0 0 16px}
body.st-1 .half.R{border-radius:0 110px 16px 0}

/* ست٢ · بسكويت مخبوز — إطار كوكيز بحبيبات ومصراعا كريمة بلوح شوكولاتة */
body.st-2 .arch{--fp:10px;border:none;padding:0;border-radius:100px 100px 30px 30px;
  background:
   radial-gradient(circle at 22% 14%, rgba(120,70,30,.28) 0 4px, transparent 5px),
   radial-gradient(circle at 76% 8%, rgba(120,70,30,.24) 0 3px, transparent 4px),
   radial-gradient(circle at 92% 52%, rgba(120,70,30,.24) 0 4px, transparent 5px),
   radial-gradient(circle at 8% 62%, rgba(120,70,30,.22) 0 3px, transparent 4px),
   radial-gradient(circle at 55% 94%, rgba(120,70,30,.24) 0 4px, transparent 5px),
   linear-gradient(170deg,#f2c98f,#dba362);
  box-shadow:0 18px 30px -16px rgba(120,80,40,.55), inset 0 4px 0 rgba(255,255,255,.5), inset 0 -6px 0 rgba(120,70,30,.25)}
body.st-2 .inner{inset:10px;border-radius:90px 90px 22px 22px}
body.st-2 .half.L{border-radius:90px 0 0 20px}
body.st-2 .half.R{border-radius:0 90px 20px 0}
body.st-2 .half i{background:linear-gradient(180deg,#fff6e8,#ffe9cf)}
body.st-2 .half i::before,body.st-2 .half i::after{background:linear-gradient(180deg,#b98052,#96613a);
  box-shadow:inset 0 3px 6px rgba(60,30,10,.35), inset 0 -2px 0 rgba(255,255,255,.15);border-radius:18px}
body.st-2 .half .knb{background:radial-gradient(circle at 35% 35%,#fff,#e8b884 45%,#8a5a2a)}
body.st-2 .panel .tt{color:#8a5a2a}

/* ست٣ · كاندي مخطط — مصراعان بخطوط حلوى مائلة بلون الفئة */
body.st-3 .arch{--fp:9px;border:none;padding:0;border-radius:110px 110px 28px 28px;
  background:linear-gradient(180deg,#ffffff,#ffeef7);
  box-shadow:0 18px 30px -16px rgba(180,80,140,.45), inset 0 3px 0 #fff}
body.st-3 .inner{inset:9px;border-radius:100px 100px 20px 20px}
body.st-3 .half.L{border-radius:100px 0 0 18px}
body.st-3 .half.R{border-radius:0 100px 18px 0}
body.st-3 .half i{background:repeating-linear-gradient(55deg, var(--p1) 0 14px, #fff 14px 28px)}
body.st-3 .half i::before,body.st-3 .half i::after{background:rgba(255,255,255,.85);
  box-shadow:inset 0 2px 6px rgba(180,80,140,.25);border-radius:16px}
body.st-3 .half .knb{background:radial-gradient(circle at 35% 35%,#fff,#ff9db8 45%,#c94f74)}

/* ست٤ · نوافذ السحاب — مصراعان سماويان بنافذة دائرية بيضاء في كل مصراع */
body.st-4 .arch{--fp:9px;border:none;padding:0;border-radius:90px 90px 30px 30px;
  background:linear-gradient(180deg,#ffffff,#e8f1ff);
  box-shadow:0 20px 32px -18px rgba(110,140,210,.45), inset 0 3px 0 #fff}
body.st-4 .inner{inset:9px;border-radius:80px 80px 22px 22px}
body.st-4 .half.L{border-radius:80px 0 0 20px}
body.st-4 .half.R{border-radius:0 80px 20px 0}
body.st-4 .half i{background:linear-gradient(180deg,
  color-mix(in srgb,var(--c1) 40%,#fff), color-mix(in srgb,var(--c2) 46%,#fff))}
body.st-4 .half i::before,body.st-4 .half i::after{top:14%;bottom:auto;height:34%;border-radius:50%;
  background:radial-gradient(circle at 32% 28%, #ffffff, #eef5ff 70%);
  box-shadow:inset 0 -3px 6px rgba(110,140,210,.3), 0 2px 4px rgba(110,140,210,.25)}
body.st-4 .half i::before{left:16%;right:60%}
body.st-4 .half i::after{left:60%;right:16%}
body.st-4 .half .knb{background:radial-gradient(circle at 35% 35%,#fff,#dbe7ff 45%,#8fa7d9)}
body.st-4 .panel .tt{color:#5a6bb0}

/* ست٥ · باب القلوب — مصراعان ورديان بقلب أبيض بارز على كل مصراع */
body.st-5 .arch{--fp:9px;border:none;padding:0;border-radius:100px 100px 40px 40px;
  background:linear-gradient(180deg,#ffffff,#ffe9f2);
  box-shadow:0 20px 32px -18px rgba(220,90,150,.4), inset 0 3px 0 #fff}
body.st-5 .inner{inset:9px;border-radius:90px 90px 32px 32px}
body.st-5 .half.L{border-radius:90px 0 0 30px}
body.st-5 .half.R{border-radius:0 90px 30px 0}
body.st-5 .half i::before,body.st-5 .half i::after{display:none}
body.st-5 .half.L::before,body.st-5 .half.R::after{content:"♥";position:absolute;top:34%;z-index:2;
  font-size:clamp(26px,6vmin,44px);color:rgba(255,255,255,.92);
  text-shadow:0 3px 6px rgba(180,60,110,.35);line-height:1}
body.st-5 .half.L::before{right:24%}
body.st-5 .half.R::after{left:24%}
body.st-5 .half .knb{background:radial-gradient(circle at 35% 35%,#fff,#ffd0dd 45%,#e78ba4)}

/* ست٦ · ليل النجوم — مصراعان بنفسجيان عميقان بنجوم وقمر */
body.st-6 .arch{--fp:9px;border:none;padding:0;border-radius:110px 110px 26px 26px;
  background:linear-gradient(180deg,#ffffff,#eae4ff);
  box-shadow:0 20px 32px -18px rgba(90,61,150,.5), inset 0 3px 0 #fff}
body.st-6 .inner{inset:9px;border-radius:100px 100px 18px 18px}
body.st-6 .half.L{border-radius:100px 0 0 16px}
body.st-6 .half.R{border-radius:0 100px 16px 0}
body.st-6 .half i{background:
  radial-gradient(circle 2.5px at 22% 24%, #fff 95%, transparent),
  radial-gradient(circle 2px at 64% 14%, #fff 95%, transparent),
  radial-gradient(circle 2px at 82% 44%, #fff 95%, transparent),
  radial-gradient(circle 1.8px at 38% 56%, #fff 90%, transparent),
  radial-gradient(circle 1.8px at 12% 72%, #fff 90%, transparent),
  linear-gradient(180deg, color-mix(in srgb,var(--c1) 40%,#8b7ae0), color-mix(in srgb,var(--c2) 52%,#4a3d8f))}
body.st-6 .half i::before,body.st-6 .half i::after{background:rgba(255,255,255,.08);
  box-shadow:inset 0 3px 8px rgba(0,0,0,.25), inset 0 -2px 0 rgba(255,255,255,.12)}
body.st-6 .half.L i::before{content:"🌙";display:grid;place-items:center;
  font-size:clamp(15px,3vmin,22px)}
body.st-6 .panel .tt{color:#4a3d8f}
body.st-6 .half .knb{background:radial-gradient(circle at 35% 35%,#fff,#ffe9a3 45%,#c9a24e);
  box-shadow:0 0 8px rgba(255,225,140,.6), 0 2px 4px rgba(0,0,0,.3)}

/* ست٧ · خشبي كيوت — ألواح خشب باستيل بمفصلات كرتونية */
body.st-7 .arch{--fp:10px;border:none;padding:0;border-radius:96px 96px 22px 22px;
  background:linear-gradient(180deg,#8a5a2a,#6e451f);
  box-shadow:0 18px 30px -16px rgba(90,55,20,.55), inset 0 3px 0 rgba(255,255,255,.25)}
body.st-7 .inner{inset:10px;border-radius:86px 86px 14px 14px}
body.st-7 .half.L{border-radius:86px 0 0 12px}
body.st-7 .half.R{border-radius:0 86px 12px 0}
body.st-7 .half i{background:
  repeating-linear-gradient(90deg, rgba(90,55,20,.16) 0 2px, transparent 2px 24px),
  linear-gradient(180deg,#e8be8a,#d1a367)}
body.st-7 .half i::before,body.st-7 .half i::after{background:rgba(120,75,35,.2);
  box-shadow:inset 0 3px 6px rgba(60,35,10,.3), inset 0 -2px 0 rgba(255,255,255,.2);border-radius:12px}
/* مفصلات على الحواف الخارجية */
body.st-7 .half.L::before,body.st-7 .half.R::after{content:"";position:absolute;z-index:3;
  top:22%;width:16px;height:9px;border-radius:3px;
  background:linear-gradient(#5a3a18,#3e2610);box-shadow:0 26px 0 0 #4a2f13, inset 0 1px 0 rgba(255,255,255,.25)}
body.st-7 .half.L::before{left:4px}
body.st-7 .half.R::after{right:4px}
body.st-7 .half .knb{background:radial-gradient(circle at 35% 35%,#fff,#e8c07a 45%,#8a6d1f)}
body.st-7 .panel .tt{color:#6e451f}

/* ست٨ · نافذة ملكية — نصف علوي زجاج مصنفر ونصف سفلي لوح باستيل */
body.st-8 .arch{--fp:9px;border:none;padding:0;border-radius:104px 104px 24px 24px;
  background:linear-gradient(180deg,#ffffff,#f3ecff);
  box-shadow:0 20px 32px -18px rgba(109,63,240,.4), inset 0 3px 0 #fff}
body.st-8 .inner{inset:9px;border-radius:94px 94px 16px 16px}
body.st-8 .half.L{border-radius:94px 0 0 14px}
body.st-8 .half.R{border-radius:0 94px 14px 0}
body.st-8 .half i::before,body.st-8 .half i::after{display:none}
body.st-8 .half i{background:linear-gradient(180deg,
  rgba(255,255,255,.9) 0 44%,
  color-mix(in srgb,var(--c1) 52%,#fff) 44% 100%)}
/* لمعة الزجاج المصنفر */
body.st-8 .half.L i{box-shadow:inset 0 0 0 0 transparent}
body.st-8 .half.R::after,body.st-8 .half.L::before{content:"";position:absolute;top:6%;height:32%;width:14%;
  background:linear-gradient(180deg,rgba(255,255,255,.9),rgba(255,255,255,.2));
  border-radius:99px;transform:rotate(14deg);z-index:2}
body.st-8 .half.L::before{left:22%}
body.st-8 .half.R::after{right:22%}
/* حزام ذهبي يفصل الزجاج عن اللوح */
body.st-8 .half i::before{display:block;top:43%;bottom:auto;height:9px;left:0;right:0;border-radius:0;
  background:linear-gradient(#ffe9a3,#caa74e);box-shadow:0 1px 3px rgba(0,0,0,.2)}
body.st-8 .half .knb{background:radial-gradient(circle at 35% 35%,#fff,#ffe9a3 45%,#c9a24e)}

/* ست٩ · جيلي لامع — مصراعان هلاميان بلمعة كبيرة وحواف أفتح */
body.st-9 .arch{--fp:8px;border:none;padding:0;border-radius:96px 96px 40px 40px;
  background:color-mix(in srgb,var(--c2) 26%,#fff);
  box-shadow:0 22px 36px -18px color-mix(in srgb,var(--c2) 55%,transparent), inset 0 3px 0 rgba(255,255,255,.8)}
body.st-9 .inner{inset:8px;border-radius:88px 88px 32px 32px}
body.st-9 .half.L{border-radius:88px 0 0 30px}
body.st-9 .half.R{border-radius:0 88px 30px 0}
body.st-9 .half i{background:
  radial-gradient(ellipse 60% 24% at 50% 10%, rgba(255,255,255,.75), rgba(255,255,255,0) 70%),
  linear-gradient(180deg, color-mix(in srgb,var(--c1) 66%,#fff), color-mix(in srgb,var(--c2) 78%,#fff))}
body.st-9 .half i::before,body.st-9 .half i::after{background:rgba(255,255,255,.22);
  box-shadow:inset 0 3px 10px color-mix(in srgb,var(--c2) 35%,transparent);border-radius:20px}
body.st-9 .half .knb{background:rgba(255,255,255,.95);box-shadow:0 0 8px rgba(255,255,255,.8), 0 2px 4px rgba(0,0,0,.2)}

/* ست١٠ · بوابة الهرم الذهبية — إطار ذهبي بحجر قمة ومصراعان بلون الفئة العميق */
body.st-10 .arch{--fp:10px;border:none;padding:0;border-radius:130px 130px 20px 20px;
  background:linear-gradient(180deg,#f7e3ab,#dfb96a);
  box-shadow:0 20px 32px -18px rgba(140,100,30,.5), inset 0 3px 0 #fff8dd, inset 0 -5px 0 rgba(140,100,30,.35)}
body.st-10 .arch::after{content:"";position:absolute;top:7px;left:50%;transform:translateX(-50%);
  width:22px;height:22px;border-radius:50%;z-index:6;
  background:radial-gradient(circle at 35% 30%,#fff8dd,#ffcb2e 55%,#c98f0c);
  box-shadow:0 2px 5px rgba(0,0,0,.3), inset 0 1px 0 rgba(255,255,255,.8)}
body.st-10 .inner{inset:10px;border-radius:120px 120px 12px 12px}
body.st-10 .half.L{border-radius:120px 0 0 10px}
body.st-10 .half.R{border-radius:0 120px 10px 0}
body.st-10 .half i{background:linear-gradient(180deg,var(--c1),var(--c2))}
body.st-10 .half i::before,body.st-10 .half i::after{background:rgba(255,255,255,.1);
  border:2px solid rgba(255,233,163,.55);border-radius:60px 60px 10px 10px;
  box-shadow:inset 0 3px 8px rgba(0,0,0,.25)}
body.st-10 .half .knb{background:radial-gradient(circle at 35% 35%,#fff8dd,#ffcb2e 45%,#c98f0c)}
body.st-10 .panel .tt{background:#fff8dd;color:#8a6508;box-shadow:0 3px 0 #caa74e}

.sv.on{outline:3px solid var(--v);outline-offset:2px}

/* ─── طبقات عامة ─── */
#veil{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:60}
#ready{position:fixed;inset:0;display:grid;place-items:center;opacity:0;pointer-events:none;z-index:61}
#ready b{font-size:clamp(30px,8vw,58px);font-weight:800;
  background:linear-gradient(120deg,#22b8e6,#8b5cf6 55%,#ff2f8e);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 30px rgba(139,92,246,.4))}
#hint{position:absolute;bottom:10px;inset-inline:0;text-align:center;font-size:12px;color:var(--dim);
  pointer-events:none;z-index:5}
</style>
</head>
<body class="st-1">

<header>
  <h1>🚪 مختبر حركات الدخول عبر الباب</h1>
  <p>اضغط رقم الحركة لتشغيلها — يعاد المشهد تلقائياً بعد كل تجربة</p>
</header>

<div id="bar">
  <button class="mv" data-m="1"><span class="n">١</span>زوم الكاميرا ثم الفتح<small>الباب ثابت والكاميرا تقترب ثم يُفتح وندخل</small></button>
  <button class="mv" data-m="2"><span class="n">٢</span>الطيران عبر الباب<small>الباب يكبر نحونا ومصراعه ينفتح أثناء العبور</small></button>
  <button class="mv" data-m="3"><span class="n">٣</span>بوابة النور<small>المصراع ينزلق ونورٌ من داخله يبتلع الشاشة</small></button>
  <button class="mv" data-m="4"><span class="n">٤</span>المصراعان ✓<small>المعتمدة في اللعبة — الباب ينشق نصفين</small></button>
</div>

<div id="bar" style="padding-top:0">
  <span style="align-self:center;font-size:13px;font-weight:800;color:var(--dim)">🎨 ستايل الباب:</span>
  <button class="mv sv on" data-s="1"><span class="n">١</span>مارشميلو كلاسيك<small>قوس كريمي ومصراعان بلوحين غائرين</small></button>
  <button class="mv sv" data-s="2"><span class="n">٢</span>بسكويت مخبوز<small>إطار كوكيز ومصراعا كريمة بلوح شوكولاتة</small></button>
  <button class="mv sv" data-s="3"><span class="n">٣</span>كاندي مخطط<small>مصراعان بخطوط حلوى بلون الفئة</small></button>
  <button class="mv sv" data-s="4"><span class="n">٤</span>نوافذ السحاب<small>نافذة دائرية بيضاء في كل مصراع</small></button>
  <button class="mv sv" data-s="5"><span class="n">٥</span>باب القلوب<small>قلب أبيض بارز على كل مصراع</small></button>
  <button class="mv sv" data-s="6"><span class="n">٦</span>ليل النجوم<small>مصراعان بنفسجيان بنجوم وقمر</small></button>
  <button class="mv sv" data-s="7"><span class="n">٧</span>خشبي كيوت<small>ألواح خشب باستيل بمفصلات كرتونية</small></button>
  <button class="mv sv" data-s="8"><span class="n">٨</span>نافذة ملكية<small>زجاج مصنفر فوق ولوح ملون تحت وحزام ذهبي</small></button>
  <button class="mv sv" data-s="9"><span class="n">٩</span>جيلي لامع<small>مصراعان هلاميان بلمعة كبيرة</small></button>
  <button class="mv sv" data-s="10"><span class="n">١٠</span>بوابة الهرم<small>إطار ذهبي بحجر قمة ولوحان معقودان</small></button>
</div>

<div id="stageWrap">
  <div id="stage">
    <div id="world"></div>
    <div id="hint">الباب الفائز دائماً: 🌍 جغرافيا (الأعلى يميناً)</div>
  </div>
</div>

<div id="veil"></div>
<div id="ready"><b>جاهزون للسؤال؟</b></div>

<script>
"use strict";
/* ═════════ بيانات الأبواب ═════════ */
const DOORS=[
  {em:"🌍",tt:"جغرافيا",c1:"#34d399",c2:"#0e9f6e"},
  {em:"📜",tt:"تاريخ",  c1:"#fbbf24",c2:"#d97706"},
  {em:"⚽",tt:"رياضة",  c1:"#60a5fa",c2:"#2563eb"},
  {em:"🔬",tt:"علوم",   c1:"#f472b6",c2:"#db2777"}
];
const WIN=0;              // الباب الفائز في كل التجارب: الأول (أعلى اليمين في RTL)
const world=document.getElementById("world");
const stage=document.getElementById("stage");
const veil=document.getElementById("veil");
const ready=document.getElementById("ready");
let busy=false;

/* ═════════ بناء المشهد من جديد ═════════ */
function build(){
  // نلغي أي أنيميشن سابق على أي عنصر
  document.getAnimations().forEach(a=>a.cancel());
  world.style.transform="";
  world.style.transformOrigin="";
  world.innerHTML="";
  DOORS.forEach((d,i)=>{
    const el=document.createElement("div");
    el.className="door";el.dataset.i=i;
    el.style.setProperty("--c1",d.c1);
    el.style.setProperty("--c2",d.c2);
    el.innerHTML=
      '<div class="arch">'+
        '<div class="inner"><div class="glow"></div></div>'+
        '<div class="half L"><i></i><span class="knb"></span></div>'+
        '<div class="half R"><i></i><span class="knb"></span></div>'+
        '<div class="panel"><span class="em">'+d.em+'</span><span class="tt">'+d.tt+'</span></div>'+
      '</div>';
    world.appendChild(el);
  });
}
build();

/* ═════════ أدوات مشتركة ═════════ */
const $$=s=>[...document.querySelectorAll(s)];
const winEl=()=>world.querySelector('.door[data-i="'+WIN+'"]');
const losers=()=>$$(".door").filter(d=>+d.dataset.i!==WIN);
const wait=ms=>new Promise(r=>setTimeout(r,ms));
function fadeLosers(ms=300){
  losers().forEach(d=>d.animate([{opacity:1},{opacity:0}],{duration:ms,fill:"forwards",easing:"ease-out"}));
}
function flash(delay,inMs,hold,outMs){
  veil.animate([{opacity:0},{opacity:0,offset:.01},{opacity:.95}],{duration:inMs,delay,fill:"forwards",easing:"ease-in"});
  setTimeout(()=>veil.animate([{opacity:.95},{opacity:0}],{duration:outMs,fill:"forwards"}),delay+inMs+hold);
}
function showReady(delay){
  setTimeout(()=>{
    ready.animate([{opacity:0,transform:"scale(.8)"},{opacity:1,transform:"scale(1)"}],{duration:350,fill:"forwards",easing:"cubic-bezier(.22,1,.36,1)"});
    setTimeout(()=>ready.animate([{opacity:1},{opacity:0}],{duration:300,fill:"forwards"}),1400);
  },delay);
}
/* كم نحتاج من التكبير والإزاحة حتى يتمركز الباب ويملأ الشاشة */
function camMath(el,fill=1.15){
  const r=el.getBoundingClientRect(), s=stage.getBoundingClientRect();
  const sc=Math.max(s.width/r.width, s.height/r.height)*fill;
  const dx=(s.left+s.width/2)-(r.left+r.width/2);
  const dy=(s.top+s.height/2)-(r.top+r.height/2);
  return {sc,dx,dy,r};
}
function finish(total){
  setTimeout(()=>{build();busy=false;$$(".mv").forEach(b=>b.disabled=false);},total);
}

/* ═════════ ١ · زوم الكاميرا ثم الفتح (فكرتك) ═════════
   الأبواب ثابتة تماماً — «الكاميرا» (المشهد كله) تتحرك وتقترب من الباب،
   ثم يُفتح المصراع وندخل من الفتحة. */
function m1(){
  const w=winEl(), {sc,dx,dy,r}=camMath(w,0.98);
  // الدقة: نثبّت محور تحويل «الكاميرا» على مركز الباب نفسه،
  // فيتم كل تكبير حول الباب ويبقى في منتصف الشاشة تماماً بلا انحراف
  const wr=world.getBoundingClientRect();
  world.style.transformOrigin=(r.left+r.width/2-wr.left)+"px "+(r.top+r.height/2-wr.top)+"px";
  fadeLosers(420);
  // مرحلة أولى: اقتراب هادئ حتى يملأ الباب المشهد (الباب نفسه لا يتحرك)
  world.animate([
    {transform:"translate(0px,0px) scale(1)"},
    {transform:"translate("+dx*0.55+"px,"+dy*0.55+"px) scale("+(1+(sc-1)*0.55)+")",offset:.62},
    {transform:"translate("+dx+"px,"+dy+"px) scale("+sc+")"}
  ],{duration:1150,easing:"cubic-bezier(.35,0,.25,1)",fill:"forwards"});
  // مرحلة ثانية: المصراعان ينفتحان ويكشفان النور
  const L1=w.querySelector(".half.L"), R1=w.querySelector(".half.R");
  const sg1=w.querySelector(".panel");
  if(sg1)sg1.animate([{opacity:1},{opacity:0}],{duration:240,delay:1050,fill:"forwards"});
  L1.animate([{transform:"perspective(1000px) rotateY(0)"},{transform:"perspective(1000px) rotateY(-86deg)"}],
    {duration:620,delay:1050,easing:"cubic-bezier(.6,0,.8,.4)",fill:"forwards"});
  R1.animate([{transform:"perspective(1000px) rotateY(0)"},{transform:"perspective(1000px) rotateY(86deg)"}],
    {duration:620,delay:1050,easing:"cubic-bezier(.6,0,.8,.4)",fill:"forwards"});
  // مرحلة ثالثة: دفعة أخيرة عبر الفتحة — الإزاحة ثابتة والتكبير حول مركز الباب
  world.animate([
    {transform:"translate("+dx+"px,"+dy+"px) scale("+sc+")"},
    {transform:"translate("+dx+"px,"+dy+"px) scale("+sc*2.6+")"}
  ],{duration:520,delay:1500,easing:"cubic-bezier(.55,0,.85,.4)",fill:"forwards"});
  flash(1650,380,150,420);
  showReady(2050);
  finish(3900);
}

/* ═════════ ٢ · الطيران عبر الباب (المعتمدة حالياً في اللعبة) ═════════
   الباب هو الذي يكبر ويطير نحونا ومصراعه ينفتح في منتصف الطريق. */
function m2(){
  const w=winEl(), {sc,dx,dy}=camMath(w,1.7);
  fadeLosers(260);
  const L2=w.querySelector(".half.L"), R2=w.querySelector(".half.R");
  const sg2=w.querySelector(".panel");
  if(sg2)sg2.animate([{opacity:1},{opacity:0}],{duration:220,delay:150,fill:"forwards"});
  L2.animate([{transform:"perspective(900px) rotateY(0)"},{transform:"perspective(900px) rotateY(-76deg)"}],
    {duration:480,delay:150,easing:"ease-in",fill:"forwards"});
  R2.animate([{transform:"perspective(900px) rotateY(0)"},{transform:"perspective(900px) rotateY(76deg)"}],
    {duration:480,delay:150,easing:"ease-in",fill:"forwards"});
  w.animate([
    {transform:"translate(0,0) scale(1)",filter:"brightness(1)"},
    {transform:"translate("+dx*.35+"px,"+dy*.35+"px) scale("+(1+(sc-1)*.22)+")",filter:"brightness(1.05)",offset:.45},
    {transform:"translate("+dx+"px,"+dy+"px) scale("+sc+")",filter:"brightness(1.4)"}
  ],{duration:820,easing:"cubic-bezier(.55,0,.85,.4)",fill:"forwards"});
  w.style.zIndex=5;
  flash(480,340,120,380);
  showReady(950);
  finish(2900);
}

/* ═════════ ٣ · بوابة النور ═════════
   المصراع ينزلق للأعلى كستارة، والنور الذي خلفه يتمدد دائرةً تبتلع الشاشة. */
function m3(){
  const w=winEl(), {r}=camMath(w);
  fadeLosers(300);
  // نبضة استعداد للباب
  w.animate([{transform:"scale(1)"},{transform:"scale(1.06)"},{transform:"scale(1)"}],
    {duration:420,easing:"ease-in-out"});
  // المصراعان ينزلقان جانبياً كبوابة جيب
  const L3=w.querySelector(".half.L"), R3=w.querySelector(".half.R");
  const sg3=w.querySelector(".panel");
  if(sg3)sg3.animate([{opacity:1},{opacity:0}],{duration:220,delay:430,fill:"forwards"});
  L3.animate([{transform:"translateX(0)"},{transform:"translateX(-108%)"}],
    {duration:560,delay:430,easing:"cubic-bezier(.5,0,.7,.3)",fill:"forwards"});
  R3.animate([{transform:"translateX(0)"},{transform:"translateX(108%)"}],
    {duration:560,delay:430,easing:"cubic-bezier(.5,0,.7,.3)",fill:"forwards"});
  // دائرة نور من مركز الباب تتمدد حتى تغطي كل شيء
  const s=stage.getBoundingClientRect();
  const cx=r.left+r.width/2-s.left, cy=r.top+r.height/2-s.top;
  const maxR=Math.hypot(Math.max(cx,s.width-cx),Math.max(cy,s.height-cy))*1.1;
  const orb=document.createElement("div");
  orb.style.cssText="position:absolute;left:"+(cx-10)+"px;top:"+(cy-10)+"px;width:20px;height:20px;"+
    "border-radius:50%;z-index:8;pointer-events:none;"+
    "background:radial-gradient(circle,#fffdf4 30%,#ffe9a8 60%,#ffd75e 85%,rgba(255,215,94,.9));"+
    "box-shadow:0 0 60px 30px rgba(255,220,120,.75)";
  stage.appendChild(orb);
  orb.animate([
    {transform:"scale(0)",opacity:.9},
    {transform:"scale(.28)",opacity:1,offset:.35},
    {transform:"scale("+(maxR/10)+")",opacity:1}
  ],{duration:900,delay:820,easing:"cubic-bezier(.6,0,.9,.4)",fill:"forwards"});
  flash(1580,220,140,420);
  showReady(1850);
  finish(3700);
}

/* ═════════ ٤ · المصراعان ═════════
   الباب ينشق نصفين ينفتحان للخارج، والكاميرا تندفع من الفجوة المضيئة. */
function m4(){
  const w=winEl(), {sc,dx,dy,r}=camMath(w,1.05);
  const wr=world.getBoundingClientRect();
  world.style.transformOrigin=(r.left+r.width/2-wr.left)+"px "+(r.top+r.height/2-wr.top)+"px";
  fadeLosers(300);
  const R=w.querySelector(".half.R"), L=w.querySelector(".half.L");
  // اللافتة تخبو لحظة انفتاح المصراعين
  const sign=w.querySelector(".panel");
  if(sign)sign.animate([{opacity:1},{opacity:0}],{duration:240,delay:360,fill:"forwards"});
  // طرقة خفيفة ثم انفتاح النصفين
  w.animate([{transform:"scale(1)"},{transform:"scale(1.05)"},{transform:"scale(1)"}],
    {duration:380,easing:"ease-in-out"});
  R.animate([{transform:"perspective(900px) rotateY(0)"},{transform:"perspective(900px) rotateY(82deg)"}],
    {duration:640,delay:420,easing:"cubic-bezier(.55,0,.75,.35)",fill:"forwards"});
  L.animate([{transform:"perspective(900px) rotateY(0)"},{transform:"perspective(900px) rotateY(-82deg)"}],
    {duration:640,delay:420,easing:"cubic-bezier(.55,0,.75,.35)",fill:"forwards"});
  // اندفاعة الكاميرا عبر الفجوة — التكبير حول مركز الباب فيبقى بمنتصف الشاشة
  world.animate([
    {transform:"translate(0px,0px) scale(1)"},
    {transform:"translate("+dx*.5+"px,"+dy*.5+"px) scale("+(1+(sc-1)*.5)+")",offset:.5},
    {transform:"translate("+dx+"px,"+dy+"px) scale("+sc*2.4+")"}
  ],{duration:820,delay:760,easing:"cubic-bezier(.55,0,.85,.4)",fill:"forwards"});
  flash(1250,320,140,420);
  showReady(1700);
  finish(3600);
}

/* ═════════ التشغيل ═════════ */
const RUN={1:m1,2:m2,3:m3,4:m4};
document.querySelectorAll("#bar,.mv").forEach(()=>{});
document.addEventListener("click",e=>{
  const sv=e.target.closest(".sv");
  if(sv&&!busy){
    document.body.className="st-"+sv.dataset.s;
    document.querySelectorAll(".sv").forEach(x=>x.classList.toggle("on",x===sv));
    build();
    return;
  }
  const b=e.target.closest(".mv");
  if(!b||busy)return;
  busy=true;
  document.querySelectorAll(".mv").forEach(x=>x.disabled=true);
  build();                       // مشهد نظيف قبل كل تجربة
  // setTimeout لا rAF — حتى تعمل الحركة حتى لو كان التبويب في الخلفية لحظة الضغط
  setTimeout(()=>{try{RUN[b.dataset.m]();}catch(err){busy=false;document.querySelectorAll(".mv").forEach(x=>x.disabled=false);}},40);
});
</script>
</body>
</html>
