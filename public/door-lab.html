<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>🚪 مختبر حركات الباب — قمّة الهرم</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/* ═══ مختبر تجارب دخول الباب — كل الحركات بـ Web Animations API
   (لا تتأثر بوضع «تقليل الحركة» في الجهاز) ═══ */
:root{
  --bg:#efe9fb; --card:#faf8ff; --ink:#3d2b63; --dim:#8b7fae;
  --v:#8b5cf6; --vd:#6d3ff0; --gold:#ffcb2e; --pink:#ff2f8e; --cyan:#22b8e6;
  --stroke:#d6c9f2;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:linear-gradient(170deg,#f3edfd,#e9e0fa 60%,#e2d6f8);
  font-family:"Baloo Bhaijaan 2",system-ui,sans-serif;color:var(--ink);
  display:flex;flex-direction:column;overflow:hidden}

/* ─── الرأس ─── */
header{flex:0 0 auto;text-align:center;padding:14px 12px 6px}
header h1{margin:0;font-size:clamp(19px,4.5vw,27px);font-weight:800;color:var(--vd)}
header p{margin:4px 0 0;font-size:12.5px;color:var(--dim)}

/* ─── أزرار الحركات ─── */
#bar{flex:0 0 auto;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:10px 12px}
.mv{border:2px solid var(--stroke);background:var(--card);color:var(--ink);cursor:pointer;
  border-radius:16px;padding:9px 14px;font-family:inherit;font-weight:800;font-size:13.5px;
  box-shadow:0 4px 0 var(--stroke);transition:transform .12s, box-shadow .12s}
.mv small{display:block;font-weight:600;font-size:10.5px;color:var(--dim)}
.mv:hover{transform:translateY(-2px)}
.mv:active{transform:translateY(2px);box-shadow:0 1px 0 var(--stroke)}
.mv:disabled{opacity:.45;pointer-events:none}
.mv .n{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:7px;
  background:var(--v);color:#fff;font-size:12px;margin-inline-end:5px}

/* ─── المسرح ─── */
#stageWrap{flex:1;min-height:0;position:relative;padding:8px 14px 14px}
#stage{position:relative;height:100%;border-radius:26px;overflow:hidden;
  background:linear-gradient(180deg,#f7f3ff,#efe7fd);border:2px solid var(--stroke);
  box-shadow:inset 0 2px 12px rgba(109,63,240,.06)}
#world{position:absolute;inset:0;display:grid;grid-template-columns:1fr 1fr;
  gap:clamp(10px,2.5vmin,22px);padding:clamp(12px,3vmin,26px);will-change:transform}

/* ─── الباب (نفس روح أبواب اللعبة) ─── */
.door{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:0;will-change:transform,opacity}
.arch{position:relative;width:min(86%,270px);height:92%;max-height:340px;
  border-radius:130px 130px 18px 18px;overflow:hidden;
  border:3px solid var(--c2);background:var(--c2);
  box-shadow:0 14px 28px -14px rgba(61,43,99,.45), inset 0 2px 0 rgba(255,255,255,.5);
  perspective:900px}
.inner{position:absolute;inset:7px;border-radius:118px 118px 12px 12px;overflow:hidden;
  background:radial-gradient(120% 90% at 50% 10%,#fff8e8,#ffe9a8 45%,#ffd75e);
  display:grid;place-items:center}
.glow{position:absolute;inset:0;background:radial-gradient(60% 50% at 50% 45%,rgba(255,255,255,.95),rgba(255,230,150,0) 70%)}
.panel{position:absolute;inset:7px;border-radius:118px 118px 12px 12px;overflow:hidden;
  background:linear-gradient(160deg,var(--c1),var(--c2));
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  backface-visibility:hidden;will-change:transform}
.panel .em{font-size:clamp(30px,7vmin,52px);filter:drop-shadow(0 3px 6px rgba(0,0,0,.25))}
.panel .tt{font-size:clamp(13px,3vmin,18px);font-weight:800;color:#fff;text-shadow:0 2px 4px rgba(0,0,0,.3)}
.panel .knob{position:absolute;inset-inline-start:12px;top:55%;width:11px;height:11px;border-radius:50%;
  background:radial-gradient(circle at 35% 35%,#fff,#d9c168 45%,#8a6d1f);box-shadow:0 1px 3px rgba(0,0,0,.4)}
/* نصفا الباب — للحركة الرابعة */
.half{position:absolute;top:0;bottom:0;width:50%;overflow:hidden;backface-visibility:hidden;will-change:transform}
.half.R{right:0;transform-origin:right center}
.half.L{left:0;transform-origin:left center}
.half i{position:absolute;top:0;bottom:0;width:200%;
  background:linear-gradient(160deg,var(--c1),var(--c2));display:block}
.half.R i{right:0}.half.L i{left:0}
.half .knb{position:absolute;top:55%;width:9px;height:9px;border-radius:50%;
  background:radial-gradient(circle at 35% 35%,#fff,#d9c168 45%,#8a6d1f);z-index:2}
.half.R .knb{left:8px}.half.L .knb{right:8px}
.halfEm{position:absolute;inset:0;display:grid;place-items:center;z-index:1;
  font-size:clamp(30px,7vmin,52px);filter:drop-shadow(0 3px 6px rgba(0,0,0,.25));pointer-events:none}

/* ═══ ستايلات الباب الأربعة (body.st-1..st-4) ═══ */
/* ست١ · مارشميلو — هو الافتراضي الحالي (القواعد أعلاه) */

/* ست٢ · خشبي كلاسيكي */
body.st-2 .arch{border-radius:18px;border-color:#5f3a17;background:#5f3a17}
body.st-2 .inner{border-radius:12px}
body.st-2 .panel{border-radius:12px;background:
  repeating-linear-gradient(90deg,rgba(0,0,0,.14) 0 2px,transparent 2px 30px),
  repeating-linear-gradient(0deg,rgba(255,255,255,.05) 0 3px,transparent 3px 9px),
  linear-gradient(160deg,#a86a38,#7c4a21)}
body.st-2 .panel .tt{background:var(--c1);padding:3px 14px;border-radius:10px;
  box-shadow:0 2px 0 rgba(0,0,0,.25), inset 0 1px 0 rgba(255,255,255,.4)}
body.st-2 .panel .knob{width:15px;height:15px;border:2px solid #3e2610;
  background:radial-gradient(circle at 35% 35%,#f0d18c,#8a5a20)}
body.st-2 .panel::before,body.st-2 .panel::after{content:"";position:absolute;inset-inline-end:6px;
  width:26px;height:10px;border-radius:3px;background:linear-gradient(#4a2d12,#2c1a08);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.2)}
body.st-2 .panel::before{top:16%}
body.st-2 .panel::after{bottom:12%}
body.st-2 .half i{background:
  repeating-linear-gradient(90deg,rgba(0,0,0,.14) 0 2px,transparent 2px 30px),
  linear-gradient(160deg,#a86a38,#7c4a21)}

/* ست٣ · نيون زجاجي */
body.st-3 .arch{border-radius:24px;border-color:var(--c1);background:#141122;
  box-shadow:0 0 26px -4px var(--c1), 0 14px 28px -14px rgba(61,43,99,.5)}
body.st-3 .inner{border-radius:18px}
body.st-3 .panel{border-radius:18px;background:linear-gradient(165deg,#262042,#131020)}
body.st-3 .panel::after{content:"";position:absolute;inset:9px;border:2px solid var(--c1);
  border-radius:14px;opacity:.9;pointer-events:none;
  box-shadow:0 0 14px var(--c1), inset 0 0 16px -4px var(--c1)}
body.st-3 .panel .em{filter:drop-shadow(0 0 12px var(--c1))}
body.st-3 .panel .tt{color:var(--c1);text-shadow:0 0 14px var(--c1)}
body.st-3 .panel .knob{background:var(--c1);box-shadow:0 0 12px var(--c1);border:none}
body.st-3 .half i{background:linear-gradient(165deg,#262042,#131020)}

/* ست٤ · مسرح الأضواء (روح اللعبة الأصلية) */
body.st-4 .arch{border-radius:150px 150px 16px 16px;border-color:#e9cf95;background:#e9cf95}
body.st-4 .arch::after{content:"";position:absolute;inset:0;border-radius:inherit;
  border:7px dotted #ffdf7e;pointer-events:none;z-index:4;
  filter:drop-shadow(0 0 5px #ffcf4d)}
body.st-4 .inner{border-radius:136px 136px 10px 10px}
body.st-4 .panel{border-radius:136px 136px 10px 10px;
  background:
   repeating-linear-gradient(90deg,rgba(255,255,255,.07) 0 6px,transparent 6px 26px),
   linear-gradient(160deg,var(--c1),var(--c2) 70%,#1c1330 160%)}
body.st-4 .panel .tt{background:#f7e3ab;color:#7a5512;padding:3px 16px;border-radius:99px;
  text-shadow:none;box-shadow:0 2px 0 #caa74e, inset 0 1px 0 #fff8dd}
body.st-4 .panel .knob{width:7px;height:26px;border-radius:4px;
  background:linear-gradient(#f7e3ab,#caa74e);box-shadow:0 1px 3px rgba(0,0,0,.4)}
body.st-4 .half i{background:
   repeating-linear-gradient(90deg,rgba(255,255,255,.07) 0 6px,transparent 6px 26px),
   linear-gradient(160deg,var(--c1),var(--c2))}
/* ست٥ · أبواب اللعبة الحالية — منسوخ من تصميم قمّة الهرم نفسه */
body.st-5 .arch{border:none;padding:0;border-radius:50% 50% 12px 12px / 42% 42% 8px 8px;
  background:linear-gradient(165deg,var(--g1),var(--g2) 55%,var(--g3));
  container-type:inline-size;
  box-shadow:0 16px 34px -12px rgba(0,0,0,.55), inset 0 2px 0 rgba(255,255,255,.45), inset 0 -3px 8px rgba(0,0,0,.4)}
body.st-5 .door::after{content:"";position:absolute;left:50%;top:44%;width:118%;height:70%;
  transform:translate(-50%,-50%);border-radius:50%;z-index:-1;pointer-events:none;
  background:radial-gradient(ellipse,var(--g1),transparent 66%);filter:blur(26px);opacity:.45}
body.st-5 .inner{inset:clamp(6px,1.5cqw,13px);border-radius:inherit}
body.st-5 .panel{inset:clamp(6px,1.5cqw,13px);border-radius:inherit;
  background:
   radial-gradient(ellipse at 50% 18%, color-mix(in srgb,var(--g1) 34%, transparent), transparent 58%),
   repeating-linear-gradient(115deg, rgba(255,255,255,.035) 0 2px, transparent 2px 9px),
   linear-gradient(180deg,rgba(10,16,28,.72),rgba(3,6,14,.94));
  box-shadow:inset 0 7px 22px rgba(0,0,0,.85), inset 0 0 0 1px rgba(255,255,255,.07)}
body.st-5 .panel .em,body.st-5 .panel .tt,body.st-5 .panel .knob{display:none}
body.st-5 .half i{background:linear-gradient(180deg,#0d1420,#05080f)}
.d5{display:none;position:absolute;inset:0;pointer-events:none;font-style:normal}
body.st-5 .d5{display:block}
.d5::before{content:"";position:absolute;inset:7%;border-radius:50% 50% 12px 12px / 42% 42% 8px 8px;
  border:1.5px solid color-mix(in srgb,var(--g1) 42%, transparent);opacity:.5}
.d5 .seam5{position:absolute;left:50%;top:20%;bottom:5%;width:2px;transform:translateX(-50%);font-style:normal;
  background:linear-gradient(180deg,transparent,rgba(255,255,255,.34) 22%,rgba(255,255,255,.34) 78%,transparent)}
.d5 .dTitle5{position:absolute;top:17%;left:11%;right:11%;text-align:center;color:#fff;
  font-size:9.5cqw;font-weight:900;line-height:1.2;
  text-shadow:0 2px 10px #000, 0 0 22px color-mix(in srgb,var(--g1) 60%, transparent)}
.d5 .dIcons5{position:absolute;inset:24% 0 4%;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:4%}
.d5 .big5{font-size:29cqw;line-height:1;filter:drop-shadow(0 6px 16px rgba(0,0,0,.85))}
.d5 .pair5{display:flex;gap:12cqw;margin-top:2%}
.d5 .pair5 span{font-size:15cqw;line-height:1;filter:drop-shadow(0 4px 10px rgba(0,0,0,.8))}
.d5 .dKey5{position:absolute;top:2%;left:50%;transform:translateX(-50%);
  width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-weight:900;font-size:13px;color:#1a1205;
  background:linear-gradient(160deg,#ffe9a3,#ffcb2e 55%,#c98f0c);
  box-shadow:0 3px 10px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.8)}
/* ═══════════ سبعة ستايلات مارشميلو احترافية (st-6 .. st-12) ═══════════ */
/* أساس مشترك: باستيل مشتق من لون الفئة + خلفيات النصفين للحركة الرابعة */
body.st-6 .door,body.st-7 .door,body.st-8 .door,body.st-9 .door,body.st-10 .door,body.st-11 .door,body.st-12 .door{
  --p1:color-mix(in srgb,var(--c1) 60%,#fff);
  --p2:color-mix(in srgb,var(--c2) 56%,#fff);
  --pd:color-mix(in srgb,var(--c2) 72%,#4a3560)}
body.st-6 .half i,body.st-7 .half i,body.st-8 .half i,body.st-9 .half i,body.st-10 .half i,body.st-11 .half i,body.st-12 .half i{
  background:linear-gradient(160deg,var(--p1),var(--p2))}

/* ست٦ · كب كيك كريمي — كريمة متموجة، رشّات سكر، كرزة */
body.st-6 .arch{border:none;padding:10px;border-radius:46% 46% 26px 26px / 36% 36% 26px 26px;
  background:linear-gradient(180deg,#fff9f2,#ffe9da);
  box-shadow:0 20px 34px -18px rgba(150,90,120,.5), inset 0 4px 0 #fff, inset 0 -8px 0 rgba(214,160,190,.28)}
body.st-6 .inner,body.st-6 .panel{inset:10px;border-radius:40% 40% 18px 18px / 30% 30% 18px 18px}
body.st-6 .panel{background:
  radial-gradient(circle at 18% 46%, rgba(255,255,255,.5) 0 6px, transparent 7px),
  radial-gradient(circle at 80% 52%, rgba(255,255,255,.45) 0 5px, transparent 6px),
  radial-gradient(circle at 42% 84%, rgba(255,255,255,.4) 0 5px, transparent 6px),
  linear-gradient(160deg,var(--p1),var(--p2))}
body.st-6 .panel::before{content:"";position:absolute;top:-6px;left:-4%;right:-4%;height:32%;z-index:3;pointer-events:none;
  background:
    radial-gradient(circle 15px at 11% 32%, #fffdf8 97%, transparent),
    radial-gradient(circle 19px at 34% 22%, #fffdf8 97%, transparent),
    radial-gradient(circle 16px at 58% 30%, #fffdf8 97%, transparent),
    radial-gradient(circle 20px at 82% 20%, #fffdf8 97%, transparent),
    radial-gradient(circle 13px at 97% 34%, #fffdf8 97%, transparent);
  filter:drop-shadow(0 4px 4px rgba(160,110,140,.28))}
body.st-6 .panel::after{content:"";position:absolute;top:2%;left:6%;right:6%;height:18%;z-index:4;pointer-events:none;
  background:
   linear-gradient(45deg,#ff8fb3 0 100%) no-repeat 10% 42%/9px 3px,
   linear-gradient(-30deg,#7fd8ff 0 100%) no-repeat 28% 68%/9px 3px,
   linear-gradient(70deg,#ffd75e 0 100%) no-repeat 48% 34%/9px 3px,
   linear-gradient(-60deg,#8ce68c 0 100%) no-repeat 66% 62%/9px 3px,
   linear-gradient(25deg,#d3a4ff 0 100%) no-repeat 86% 44%/9px 3px}
body.st-6 .door::after{content:"";position:absolute;top:.5%;left:50%;transform:translateX(-50%);z-index:6;
  width:20px;height:20px;border-radius:50%;
  background:radial-gradient(circle at 32% 30%,#ffb3c1,#e02444 60%,#9c0f28);
  box-shadow:0 3px 6px rgba(0,0,0,.25), inset 0 2px 3px rgba(255,255,255,.5)}
body.st-6 .panel .em{font-size:clamp(26px,6vmin,46px)}
body.st-6 .panel .tt{background:#fffdf8;color:var(--pd);padding:3px 15px;border-radius:99px;
  text-shadow:none;box-shadow:0 3px 0 rgba(214,160,190,.45)}
body.st-6 .panel .knob{border:none;background:radial-gradient(circle at 35% 35%,#fff,#ffd0dd 45%,#e78ba4)}

/* ست٧ · سحابة حالمة — غيمة بيضاء بوجه لطيف وخدود */
body.st-7 .arch{border:none;padding:9px;border-radius:60px;
  background:linear-gradient(180deg,#ffffff,#eef4ff);
  box-shadow:0 24px 38px -20px rgba(110,130,200,.5), inset 0 4px 0 #fff}
body.st-7 .inner,body.st-7 .panel{inset:9px;border-radius:52px}
body.st-7 .panel{background:
  radial-gradient(circle at 82% 12%, rgba(255,255,255,.85) 0 12px, transparent 13px),
  radial-gradient(circle at 12% 80%, rgba(255,255,255,.55) 0 9px, transparent 10px),
  linear-gradient(180deg, color-mix(in srgb,var(--c1) 36%,#fff), color-mix(in srgb,var(--c2) 42%,#fff))}
body.st-7 .door::before{content:"";position:absolute;top:.6%;left:50%;transform:translateX(-50%);z-index:6;
  width:64%;height:15%;pointer-events:none;
  background:
   radial-gradient(closest-side, #fff 97%, transparent) no-repeat 0% 100%/36% 130%,
   radial-gradient(closest-side, #fff 97%, transparent) no-repeat 50% 30%/44% 160%,
   radial-gradient(closest-side, #fff 97%, transparent) no-repeat 100% 100%/36% 130%;
  filter:drop-shadow(0 5px 8px rgba(110,130,200,.35))}
body.st-7 .panel::before{content:"";position:absolute;left:50%;bottom:20%;transform:translateX(-50%);
  width:62%;height:12px;z-index:3;pointer-events:none;
  background:
   radial-gradient(circle at 24% 50%, #4a3b60 0 4.5px, transparent 5.5px),
   radial-gradient(circle at 76% 50%, #4a3b60 0 4.5px, transparent 5.5px),
   radial-gradient(ellipse 10px 5px at 4% 60%, rgba(255,120,150,.5) 0 60%, transparent 70%),
   radial-gradient(ellipse 10px 5px at 96% 60%, rgba(255,120,150,.5) 0 60%, transparent 70%)}
body.st-7 .panel::after{content:"‿";position:absolute;left:50%;bottom:12.5%;transform:translateX(-50%);
  font-size:24px;font-weight:900;color:#4a3b60;line-height:.5;z-index:3}
body.st-7 .panel .em{font-size:clamp(26px,6vmin,46px);margin-bottom:10%}
body.st-7 .panel .tt{background:rgba(255,255,255,.88);color:#5a6bb0;padding:3px 15px;border-radius:99px;text-shadow:none;
  box-shadow:0 3px 0 rgba(140,160,220,.35)}
body.st-7 .panel .knob{border:none;background:#fff;box-shadow:0 0 8px rgba(255,255,255,.9)}

/* ست٨ · بسكويت محشو — حواف مخبوزة بحبيبات وحشوة كريمة وخياطة */
body.st-8 .arch{border:none;padding:12px;border-radius:38px;
  background:
   radial-gradient(circle at 20% 16%, rgba(120,70,30,.26) 0 4px, transparent 5px),
   radial-gradient(circle at 72% 8%, rgba(120,70,30,.22) 0 3px, transparent 4px),
   radial-gradient(circle at 90% 50%, rgba(120,70,30,.22) 0 4px, transparent 5px),
   radial-gradient(circle at 10% 66%, rgba(120,70,30,.2) 0 3px, transparent 4px),
   radial-gradient(circle at 58% 92%, rgba(120,70,30,.22) 0 4px, transparent 5px),
   radial-gradient(circle at 30% 40%, rgba(120,70,30,.16) 0 3px, transparent 4px),
   linear-gradient(170deg,#f2c98f,#dba362);
  box-shadow:0 18px 30px -16px rgba(120,80,40,.55), inset 0 4px 0 rgba(255,255,255,.5), inset 0 -6px 0 rgba(120,70,30,.25)}
body.st-8 .inner,body.st-8 .panel{inset:12px;border-radius:26px}
body.st-8 .panel{background:linear-gradient(160deg,var(--p1),var(--p2))}
body.st-8 .panel::before{content:"";position:absolute;inset:0;border:7px solid #fffdf6;border-radius:26px;z-index:3;pointer-events:none}
body.st-8 .panel::after{content:"";position:absolute;inset:8px;border:2.5px dashed color-mix(in srgb,var(--c2) 65%,#fff);
  border-radius:18px;opacity:.85;z-index:3;pointer-events:none}
body.st-8 .panel .tt{background:#fffdf6;color:#9c6b2f;padding:3px 15px;border-radius:12px;text-shadow:none;
  box-shadow:0 2px 0 #e0b87c}
body.st-8 .panel .knob{border:none;background:radial-gradient(circle at 35% 35%,#fff,#f2c98f 45%,#b07a35)}

/* ست٩ · حلوى مصاصة — خطوط كاندي مائلة وحبات سكرية ولمعة */
body.st-9 .arch{border:none;padding:10px;border-radius:120px 120px 28px 28px;
  background:linear-gradient(160deg,#ffffff,#ffeef7);
  box-shadow:0 18px 30px -16px rgba(180,80,140,.5), inset 0 3px 0 #fff}
body.st-9 .arch::after{content:"";position:absolute;inset:2px;border-radius:inherit;z-index:4;pointer-events:none;
  border:8px dotted var(--p1);opacity:.9;filter:drop-shadow(0 0 3px rgba(255,255,255,.8))}
body.st-9 .inner,body.st-9 .panel{inset:10px;border-radius:110px 110px 20px 20px}
body.st-9 .panel{background:
   repeating-linear-gradient(55deg, var(--p1) 0 16px, #fff 16px 32px, var(--p2) 32px 48px, #fff 48px 64px)}
body.st-9 .panel::before{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;
  background:linear-gradient(105deg, transparent 30%, rgba(255,255,255,.6) 42%, transparent 55%)}
body.st-9 .panel .em{filter:drop-shadow(0 3px 6px rgba(160,60,110,.4))}
body.st-9 .panel .tt{background:#fff;color:var(--pd);padding:3px 16px;border-radius:99px;text-shadow:none;
  box-shadow:0 3px 0 var(--p1)}
body.st-9 .panel .knob{width:14px;height:14px;border:2px solid #fff;
  background:repeating-conic-gradient(#fff 0 30deg,var(--p1) 30deg 60deg)}

/* ست١٠ · دمية قطيفة — نسيج مخملي وخياطة ورقعة اسم وزر قماش */
body.st-10 .arch{border:none;padding:11px;border-radius:70px 70px 34px 34px;
  background:
   repeating-linear-gradient(45deg, rgba(255,255,255,.07) 0 2px, transparent 2px 4px),
   repeating-linear-gradient(-45deg, rgba(0,0,0,.05) 0 2px, transparent 2px 4px),
   linear-gradient(165deg,var(--p1),var(--p2));
  box-shadow:0 20px 32px -18px rgba(90,61,122,.5), inset 0 4px 0 rgba(255,255,255,.35), inset 0 -8px 14px rgba(0,0,0,.08)}
body.st-10 .arch::after{content:"";position:absolute;inset:7px;border-radius:60px 60px 26px 26px;z-index:4;pointer-events:none;
  border:2.5px dashed rgba(255,255,255,.85)}
body.st-10 .inner,body.st-10 .panel{inset:11px;border-radius:58px 58px 24px 24px}
body.st-10 .panel{background:
   repeating-linear-gradient(45deg, rgba(255,255,255,.06) 0 2px, transparent 2px 4px),
   repeating-linear-gradient(-45deg, rgba(0,0,0,.045) 0 2px, transparent 2px 4px),
   linear-gradient(160deg, color-mix(in srgb,var(--c1) 46%,#fff), color-mix(in srgb,var(--c2) 44%,#fff))}
body.st-10 .panel .tt{background:#fffdf6;color:var(--pd);padding:4px 16px;border-radius:10px;text-shadow:none;
  border:2px dashed color-mix(in srgb,var(--c2) 50%,#fff);box-shadow:0 3px 0 rgba(0,0,0,.08)}
body.st-10 .panel .knob{width:16px;height:16px;border:none;
  background:
   linear-gradient(45deg, transparent 43%, #8a6d4f 45% 55%, transparent 57%),
   linear-gradient(-45deg, transparent 43%, #8a6d4f 45% 55%, transparent 57%),
   radial-gradient(circle at 35% 35%, #fff, #e8d9c4 40%, #b59872);
  box-shadow:0 2px 4px rgba(0,0,0,.25)}

/* ست١١ · جيلي شفاف — هلام لامع بفقاعات وانعكاس ضوء كبير */
body.st-11 .arch{border:none;padding:8px;border-radius:90px 90px 40px 40px;
  background:color-mix(in srgb,var(--c2) 28%,#fff);
  box-shadow:0 22px 36px -18px color-mix(in srgb,var(--c2) 55%,transparent), inset 0 3px 0 rgba(255,255,255,.75)}
body.st-11 .inner,body.st-11 .panel{inset:8px;border-radius:82px 82px 32px 32px}
body.st-11 .panel{background:
   radial-gradient(circle at 26% 16%, rgba(255,255,255,.9) 0 9%, rgba(255,255,255,.25) 24%, transparent 38%),
   radial-gradient(circle at 70% 80%, rgba(255,255,255,.35) 0 6px, transparent 8px),
   radial-gradient(circle at 34% 64%, rgba(255,255,255,.3) 0 5px, transparent 7px),
   radial-gradient(circle at 60% 42%, rgba(255,255,255,.28) 0 4px, transparent 6px),
   radial-gradient(circle at 82% 30%, rgba(255,255,255,.25) 0 4px, transparent 6px),
   linear-gradient(170deg, color-mix(in srgb,var(--c1) 70%,#fff), color-mix(in srgb,var(--c2) 82%,#fff));
  box-shadow:inset 0 -12px 20px color-mix(in srgb,var(--c2) 45%,transparent), inset 0 6px 10px rgba(255,255,255,.55)}
body.st-11 .panel .tt{background:rgba(255,255,255,.8);color:var(--pd);padding:3px 15px;border-radius:99px;text-shadow:none}
body.st-11 .panel .em{filter:drop-shadow(0 4px 8px color-mix(in srgb,var(--c2) 55%,transparent))}
body.st-11 .panel .knob{border:none;background:rgba(255,255,255,.9);box-shadow:0 0 8px rgba(255,255,255,.9)}

/* ست١٢ · ماكارون ملكي — صدفتان بلونين وكريمة بيضاء وقدم منقّطة وتاج */
body.st-12 .arch{border:none;padding:9px;border-radius:48% 48% 42% 42% / 42% 42% 36% 36%;
  background:linear-gradient(180deg,color-mix(in srgb,var(--c1) 48%,#fff),color-mix(in srgb,var(--c2) 46%,#fff));
  box-shadow:0 20px 34px -18px rgba(120,80,140,.5), inset 0 4px 0 rgba(255,255,255,.55)}
body.st-12 .inner,body.st-12 .panel{inset:9px;border-radius:44% 44% 38% 38% / 38% 38% 32% 32%}
body.st-12 .panel{background:linear-gradient(180deg, var(--p1) 0 43%, #fffdf6 43% 57%, var(--p2) 57% 100%)}
body.st-12 .panel::before{content:"";position:absolute;left:0;right:0;top:40%;height:5%;z-index:2;pointer-events:none;
  background:radial-gradient(circle 4px, #fffdf6 92%, transparent) left center/9% 100% repeat-x}
body.st-12 .panel::after{content:"";position:absolute;left:0;right:0;top:55%;height:5%;z-index:2;pointer-events:none;
  background:radial-gradient(circle 4px, #fffdf6 92%, transparent) 4.5% center/9% 100% repeat-x}
body.st-12 .panel .em{position:absolute;top:9%;left:50%;transform:translateX(-50%);margin:0;
  font-size:clamp(20px,4.6vmin,34px)}
body.st-12 .panel .tt{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);margin:0;
  color:#8a5a7a;background:none;text-shadow:none;font-size:clamp(12px,2.6vmin,16px)}
body.st-12 .panel .knob{inset-inline-start:auto;left:50%;top:auto;bottom:16%;transform:translateX(-50%);
  border:none;background:radial-gradient(circle at 35% 35%,#fff,#f7e3ab 45%,#caa74e)}
body.st-12 .door::after{content:"👑";position:absolute;top:-.5%;left:50%;transform:translateX(-50%);
  font-size:clamp(16px,3vmin,24px);z-index:6;filter:drop-shadow(0 2px 4px rgba(0,0,0,.3))}

.sv.on{outline:3px solid var(--v);outline-offset:2px}

/* ─── طبقات عامة ─── */
#veil{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:60}
#ready{position:fixed;inset:0;display:grid;place-items:center;opacity:0;pointer-events:none;z-index:61}
#ready b{font-size:clamp(30px,8vw,58px);font-weight:800;
  background:linear-gradient(120deg,#22b8e6,#8b5cf6 55%,#ff2f8e);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 30px rgba(139,92,246,.4))}
#hint{position:absolute;bottom:10px;inset-inline:0;text-align:center;font-size:12px;color:var(--dim);
  pointer-events:none;z-index:5}
</style>
</head>
<body class="st-1">

<header>
  <h1>🚪 مختبر حركات الدخول عبر الباب</h1>
  <p>اضغط رقم الحركة لتشغيلها — يعاد المشهد تلقائياً بعد كل تجربة</p>
</header>

<div id="bar">
  <button class="mv" data-m="1"><span class="n">١</span>زوم الكاميرا ثم الفتح<small>الباب ثابت والكاميرا تقترب ثم يُفتح وندخل</small></button>
  <button class="mv" data-m="2"><span class="n">٢</span>الطيران عبر الباب<small>الباب يكبر نحونا ومصراعه ينفتح أثناء العبور</small></button>
  <button class="mv" data-m="3"><span class="n">٣</span>بوابة النور<small>المصراع ينزلق ونورٌ من داخله يبتلع الشاشة</small></button>
  <button class="mv" data-m="4"><span class="n">٤</span>المصراعان<small>الباب ينشق نصفين والكاميرا تندفع من بينهما</small></button>
</div>

<div id="bar" style="padding-top:0">
  <span style="align-self:center;font-size:13px;font-weight:800;color:var(--dim)">🎨 ستايل الباب:</span>
  <button class="mv sv on" data-s="1"><span class="n">١</span>مارشميلو<small>الستايل الحالي في اللعبة</small></button>
  <button class="mv sv" data-s="2"><span class="n">٢</span>خشبي كلاسيكي<small>ألواح خشب ومفصلات ولافتة ملونة</small></button>
  <button class="mv sv" data-s="3"><span class="n">٣</span>نيون زجاجي<small>داكن بإطار متوهج بلون الفئة</small></button>
  <button class="mv sv" data-s="4"><span class="n">٤</span>مسرح الأضواء<small>قوس ذهبي بلمبات — روح اللعبة الأصلية</small></button>
  <button class="mv sv" data-s="5"><span class="n">٥</span>أبوابنا الحالية<small>تصميم أبواب قمّة الهرم الموجود الآن</small></button>
  <button class="mv sv" data-s="6"><span class="n">٦</span>كب كيك كريمي<small>كريمة متموجة ورشّات سكر وكرزة</small></button>
  <button class="mv sv" data-s="7"><span class="n">٧</span>سحابة حالمة<small>غيمة بوجه لطيف وخدود وردية</small></button>
  <button class="mv sv" data-s="8"><span class="n">٨</span>بسكويت محشو<small>حواف مخبوزة وحشوة كريمة وخياطة</small></button>
  <button class="mv sv" data-s="9"><span class="n">٩</span>حلوى مصاصة<small>خطوط كاندي وحبات سكرية ولمعة</small></button>
  <button class="mv sv" data-s="10"><span class="n">١٠</span>دمية قطيفة<small>مخمل مخيّط ورقعة اسم وزر قماش</small></button>
  <button class="mv sv" data-s="11"><span class="n">١١</span>جيلي شفاف<small>هلام لامع بفقاعات وانعكاس ضوء</small></button>
  <button class="mv sv" data-s="12"><span class="n">١٢</span>ماكارون ملكي<small>صدفتان وكريمة وقدم منقطة وتاج</small></button>

<div id="stageWrap">
  <div id="stage">
    <div id="world"></div>
    <div id="hint">الباب الفائز دائماً: 🌍 جغرافيا (الأعلى يميناً)</div>
  </div>
</div>

<div id="veil"></div>
<div id="ready"><b>جاهزون للسؤال؟</b></div>

<script>
"use strict";
/* ═════════ بيانات الأبواب ═════════ */
const DOORS=[
  {em:"🌍",tt:"جغرافيا",c1:"#34d399",c2:"#0e9f6e",g:["#5fb4e6","#2b7bb0","#164a6e"],big:"🗺️",pair:["🏔️","🌊"]},
  {em:"📜",tt:"تاريخ",  c1:"#fbbf24",c2:"#d97706",g:["#c9b28a","#8d7350","#5c4a31"],big:"🏛️",pair:["⚔️","📜"]},
  {em:"⚽",tt:"رياضة",  c1:"#60a5fa",c2:"#2563eb",g:["#d7dde6","#98a4b4","#5c6675"],big:"🎮",pair:["⚽","🎾"]},
  {em:"🔬",tt:"علوم",   c1:"#f472b6",c2:"#db2777",g:["#6fd18a","#2f9e5c","#175f36"],big:"🧬",pair:["🌋","⚛️"]}
];
const KEY5=["أ","ب","ج","د"];
const WIN=0;              // الباب الفائز في كل التجارب: الأول (أعلى اليمين في RTL)
const world=document.getElementById("world");
const stage=document.getElementById("stage");
const veil=document.getElementById("veil");
const ready=document.getElementById("ready");
let busy=false;

/* ═════════ بناء المشهد من جديد ═════════ */
function build(){
  // نلغي أي أنيميشن سابق على أي عنصر
  document.getAnimations().forEach(a=>a.cancel());
  world.style.transform="";
  world.style.transformOrigin="";
  world.innerHTML="";
  DOORS.forEach((d,i)=>{
    const el=document.createElement("div");
    el.className="door";el.dataset.i=i;
    el.style.setProperty("--c1",d.c1);
    el.style.setProperty("--c2",d.c2);
    el.style.setProperty("--g1",d.g[0]);
    el.style.setProperty("--g2",d.g[1]);
    el.style.setProperty("--g3",d.g[2]);
    el.innerHTML=
      '<div class="arch">'+
        '<div class="inner"><div class="glow"></div></div>'+
        '<div class="panel"><span class="em">'+d.em+'</span><span class="tt">'+d.tt+'</span><span class="knob"></span>'+
          '<span class="d5"><i class="seam5"></i><b class="dTitle5">'+d.tt+'</b>'+
          '<span class="dIcons5"><span class="big5">'+d.big+'</span>'+
          '<span class="pair5"><span>'+d.pair[0]+'</span><span>'+d.pair[1]+'</span></span></span>'+
          '<b class="dKey5">'+KEY5[i]+'</b></span>'+
        '</div>'+
        '<div class="half R"><i></i><span class="halfEm">'+d.em+'</span><span class="knb"></span></div>'+
        '<div class="half L"><i></i><span class="knb"></span></div>'+
      '</div>';
    // النصفان مخفيان افتراضياً — يظهران فقط في الحركة الرابعة
    el.querySelectorAll(".half").forEach(h=>h.style.display="none");
    world.appendChild(el);
  });
}
build();

/* ═════════ أدوات مشتركة ═════════ */
const $$=s=>[...document.querySelectorAll(s)];
const winEl=()=>world.querySelector('.door[data-i="'+WIN+'"]');
const losers=()=>$$(".door").filter(d=>+d.dataset.i!==WIN);
const wait=ms=>new Promise(r=>setTimeout(r,ms));
function fadeLosers(ms=300){
  losers().forEach(d=>d.animate([{opacity:1},{opacity:0}],{duration:ms,fill:"forwards",easing:"ease-out"}));
}
function flash(delay,inMs,hold,outMs){
  veil.animate([{opacity:0},{opacity:0,offset:.01},{opacity:.95}],{duration:inMs,delay,fill:"forwards",easing:"ease-in"});
  setTimeout(()=>veil.animate([{opacity:.95},{opacity:0}],{duration:outMs,fill:"forwards"}),delay+inMs+hold);
}
function showReady(delay){
  setTimeout(()=>{
    ready.animate([{opacity:0,transform:"scale(.8)"},{opacity:1,transform:"scale(1)"}],{duration:350,fill:"forwards",easing:"cubic-bezier(.22,1,.36,1)"});
    setTimeout(()=>ready.animate([{opacity:1},{opacity:0}],{duration:300,fill:"forwards"}),1400);
  },delay);
}
/* كم نحتاج من التكبير والإزاحة حتى يتمركز الباب ويملأ الشاشة */
function camMath(el,fill=1.15){
  const r=el.getBoundingClientRect(), s=stage.getBoundingClientRect();
  const sc=Math.max(s.width/r.width, s.height/r.height)*fill;
  const dx=(s.left+s.width/2)-(r.left+r.width/2);
  const dy=(s.top+s.height/2)-(r.top+r.height/2);
  return {sc,dx,dy,r};
}
function finish(total){
  setTimeout(()=>{build();busy=false;$$(".mv").forEach(b=>b.disabled=false);},total);
}

/* ═════════ ١ · زوم الكاميرا ثم الفتح (فكرتك) ═════════
   الأبواب ثابتة تماماً — «الكاميرا» (المشهد كله) تتحرك وتقترب من الباب،
   ثم يُفتح المصراع وندخل من الفتحة. */
function m1(){
  const w=winEl(), {sc,dx,dy,r}=camMath(w,0.98);
  // الدقة: نثبّت محور تحويل «الكاميرا» على مركز الباب نفسه،
  // فيتم كل تكبير حول الباب ويبقى في منتصف الشاشة تماماً بلا انحراف
  const wr=world.getBoundingClientRect();
  world.style.transformOrigin=(r.left+r.width/2-wr.left)+"px "+(r.top+r.height/2-wr.top)+"px";
  fadeLosers(420);
  // مرحلة أولى: اقتراب هادئ حتى يملأ الباب المشهد (الباب نفسه لا يتحرك)
  world.animate([
    {transform:"translate(0px,0px) scale(1)"},
    {transform:"translate("+dx*0.55+"px,"+dy*0.55+"px) scale("+(1+(sc-1)*0.55)+")",offset:.62},
    {transform:"translate("+dx+"px,"+dy+"px) scale("+sc+")"}
  ],{duration:1150,easing:"cubic-bezier(.35,0,.25,1)",fill:"forwards"});
  // مرحلة ثانية: المصراع ينفتح للداخل ويكشف النور
  const panel=w.querySelector(".panel");
  panel.style.transformOrigin="left center";
  panel.animate([
    {transform:"perspective(1000px) rotateY(0deg)"},
    {transform:"perspective(1000px) rotateY(-88deg)",filter:"brightness(1.15)"}
  ],{duration:620,delay:1050,easing:"cubic-bezier(.6,0,.8,.4)",fill:"forwards"});
  // مرحلة ثالثة: دفعة أخيرة عبر الفتحة — الإزاحة ثابتة والتكبير حول مركز الباب
  world.animate([
    {transform:"translate("+dx+"px,"+dy+"px) scale("+sc+")"},
    {transform:"translate("+dx+"px,"+dy+"px) scale("+sc*2.6+")"}
  ],{duration:520,delay:1500,easing:"cubic-bezier(.55,0,.85,.4)",fill:"forwards"});
  flash(1650,380,150,420);
  showReady(2050);
  finish(3900);
}

/* ═════════ ٢ · الطيران عبر الباب (المعتمدة حالياً في اللعبة) ═════════
   الباب هو الذي يكبر ويطير نحونا ومصراعه ينفتح في منتصف الطريق. */
function m2(){
  const w=winEl(), {sc,dx,dy}=camMath(w,1.7);
  fadeLosers(260);
  const panel=w.querySelector(".panel");
  panel.style.transformOrigin="left center";
  panel.animate([
    {transform:"perspective(900px) rotateY(0deg)"},
    {transform:"perspective(900px) rotateY(-74deg)"}
  ],{duration:480,delay:150,easing:"ease-in",fill:"forwards"});
  w.animate([
    {transform:"translate(0,0) scale(1)",filter:"brightness(1)"},
    {transform:"translate("+dx*.35+"px,"+dy*.35+"px) scale("+(1+(sc-1)*.22)+")",filter:"brightness(1.05)",offset:.45},
    {transform:"translate("+dx+"px,"+dy+"px) scale("+sc+")",filter:"brightness(1.4)"}
  ],{duration:820,easing:"cubic-bezier(.55,0,.85,.4)",fill:"forwards"});
  w.style.zIndex=5;
  flash(480,340,120,380);
  showReady(950);
  finish(2900);
}

/* ═════════ ٣ · بوابة النور ═════════
   المصراع ينزلق للأعلى كستارة، والنور الذي خلفه يتمدد دائرةً تبتلع الشاشة. */
function m3(){
  const w=winEl(), {r}=camMath(w);
  fadeLosers(300);
  // نبضة استعداد للباب
  w.animate([{transform:"scale(1)"},{transform:"scale(1.06)"},{transform:"scale(1)"}],
    {duration:420,easing:"ease-in-out"});
  // المصراع يصعد كستارة
  const panel=w.querySelector(".panel");
  panel.animate([
    {transform:"translateY(0)"},
    {transform:"translateY(-104%)"}
  ],{duration:560,delay:430,easing:"cubic-bezier(.5,0,.7,.3)",fill:"forwards"});
  // دائرة نور من مركز الباب تتمدد حتى تغطي كل شيء
  const s=stage.getBoundingClientRect();
  const cx=r.left+r.width/2-s.left, cy=r.top+r.height/2-s.top;
  const maxR=Math.hypot(Math.max(cx,s.width-cx),Math.max(cy,s.height-cy))*1.1;
  const orb=document.createElement("div");
  orb.style.cssText="position:absolute;left:"+(cx-10)+"px;top:"+(cy-10)+"px;width:20px;height:20px;"+
    "border-radius:50%;z-index:8;pointer-events:none;"+
    "background:radial-gradient(circle,#fffdf4 30%,#ffe9a8 60%,#ffd75e 85%,rgba(255,215,94,.9));"+
    "box-shadow:0 0 60px 30px rgba(255,220,120,.75)";
  stage.appendChild(orb);
  orb.animate([
    {transform:"scale(0)",opacity:.9},
    {transform:"scale(.28)",opacity:1,offset:.35},
    {transform:"scale("+(maxR/10)+")",opacity:1}
  ],{duration:900,delay:820,easing:"cubic-bezier(.6,0,.9,.4)",fill:"forwards"});
  flash(1580,220,140,420);
  showReady(1850);
  finish(3700);
}

/* ═════════ ٤ · المصراعان ═════════
   الباب ينشق نصفين ينفتحان للخارج، والكاميرا تندفع من الفجوة المضيئة. */
function m4(){
  const w=winEl(), {sc,dx,dy,r}=camMath(w,1.05);
  const wr=world.getBoundingClientRect();
  world.style.transformOrigin=(r.left+r.width/2-wr.left)+"px "+(r.top+r.height/2-wr.top)+"px";
  fadeLosers(300);
  // نستبدل اللوح الواحد بنصفين
  w.querySelector(".panel").style.display="none";
  w.querySelectorAll(".half").forEach(h=>h.style.display="block");
  const R=w.querySelector(".half.R"), L=w.querySelector(".half.L");
  // طرقة خفيفة ثم انفتاح النصفين
  w.animate([{transform:"scale(1)"},{transform:"scale(1.05)"},{transform:"scale(1)"}],
    {duration:380,easing:"ease-in-out"});
  R.animate([{transform:"perspective(900px) rotateY(0)"},{transform:"perspective(900px) rotateY(82deg)"}],
    {duration:640,delay:420,easing:"cubic-bezier(.55,0,.75,.35)",fill:"forwards"});
  L.animate([{transform:"perspective(900px) rotateY(0)"},{transform:"perspective(900px) rotateY(-82deg)"}],
    {duration:640,delay:420,easing:"cubic-bezier(.55,0,.75,.35)",fill:"forwards"});
  // اندفاعة الكاميرا عبر الفجوة — التكبير حول مركز الباب فيبقى بمنتصف الشاشة
  world.animate([
    {transform:"translate(0px,0px) scale(1)"},
    {transform:"translate("+dx*.5+"px,"+dy*.5+"px) scale("+(1+(sc-1)*.5)+")",offset:.5},
    {transform:"translate("+dx+"px,"+dy+"px) scale("+sc*2.4+")"}
  ],{duration:820,delay:760,easing:"cubic-bezier(.55,0,.85,.4)",fill:"forwards"});
  flash(1250,320,140,420);
  showReady(1700);
  finish(3600);
}

/* ═════════ التشغيل ═════════ */
const RUN={1:m1,2:m2,3:m3,4:m4};
document.querySelectorAll("#bar,.mv").forEach(()=>{});
document.addEventListener("click",e=>{
  const sv=e.target.closest(".sv");
  if(sv&&!busy){
    document.body.className="st-"+sv.dataset.s;
    document.querySelectorAll(".sv").forEach(x=>x.classList.toggle("on",x===sv));
    build();
    return;
  }
  const b=e.target.closest(".mv");
  if(!b||busy)return;
  busy=true;
  document.querySelectorAll(".mv").forEach(x=>x.disabled=true);
  build();                       // مشهد نظيف قبل كل تجربة
  // setTimeout لا rAF — حتى تعمل الحركة حتى لو كان التبويب في الخلفية لحظة الضغط
  setTimeout(()=>{try{RUN[b.dataset.m]();}catch(err){busy=false;document.querySelectorAll(".mv").forEach(x=>x.disabled=false);}},40);
});
</script>
</body>
</html>
