<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>مختبر لعبة التوصيل — قمّة الهرم</title>
<style>
:root{
  --bg:#0b0f1e; --panel:#131a30; --line:#26304e; --ink:#eaf0ff; --dim:#93a2c4;
  --cyan:#22e6ff; --violet:#8b5cf6; --gold:#ffcb2e; --lime:#39e08a; --red:#ff4d5e;
  --ease:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,"Segoe UI",Tahoma,sans-serif;
  display:flex;overflow:hidden}

/* ═══ اللوحة ═══ */
#panel{width:330px;flex-shrink:0;height:100%;overflow-y:auto;background:var(--panel);
  border-inline-start:1px solid var(--line);padding:12px 12px 60px}
#panel h1{font-size:15px;font-weight:900;color:var(--gold);margin-bottom:10px;text-align:center}
.grp{border:1px solid var(--line);border-radius:12px;padding:9px 10px;margin-bottom:9px;
  background:rgba(255,255,255,.02)}
.grp>h2{font-size:12.5px;font-weight:900;color:var(--cyan);margin-bottom:7px}
.f{display:flex;align-items:center;gap:7px;margin-bottom:5px}
.f label{width:96px;flex-shrink:0;font-size:11.5px;color:var(--dim)}
.f .vv{flex:1;display:flex;align-items:center;gap:6px;min-width:0}
.f input[type=range]{flex:1;min-width:0;accent-color:var(--violet);height:20px}
.f output{width:52px;text-align:end;font-size:11px;font-variant-numeric:tabular-nums;color:var(--gold)}
.seg{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:7px}
.seg button{flex:1;min-width:56px;padding:6px 4px;border-radius:9px;border:1px solid var(--line);
  background:rgba(255,255,255,.04);color:var(--ink);font:inherit;font-size:12px;font-weight:800;cursor:pointer}
.seg button.on{background:var(--violet);border-color:var(--violet);color:#fff}
.btn{width:100%;padding:8px;border-radius:10px;border:1px solid var(--line);
  background:rgba(139,92,246,.2);color:var(--ink);font:inherit;font-size:12.5px;font-weight:800;
  cursor:pointer;margin-top:5px}
.btn:hover{background:rgba(139,92,246,.36)}
.btn.gold{background:rgba(255,203,46,.18);border-color:rgba(255,203,46,.5);color:var(--gold)}
.note{font-size:11px;color:var(--dim);line-height:1.6;margin-top:6px}
.chk{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--dim);margin-bottom:5px;cursor:pointer}
#out{width:100%;height:120px;background:#080c18;color:var(--lime);border:1px solid var(--line);
  border-radius:9px;font:11px/1.45 ui-monospace,monospace;padding:7px;resize:vertical;direction:ltr}

/* ═══ المسرح ═══ */
#wrap{flex:1;min-width:0;height:100%;display:flex;align-items:center;justify-content:center;padding:12px}
#stage{position:relative;overflow:hidden;border-radius:14px;background:#e6dcf3;
  box-shadow:0 20px 60px -22px #000}
#bg{position:absolute;display:block;object-fit:fill}
#screen{position:absolute}
#screen.grid::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:9;
  border:1px dashed rgba(34,230,255,.8);
  background:linear-gradient(90deg,rgba(34,230,255,.22) 1px,transparent 1px) 0 0/10% 100%,
             linear-gradient(0deg,rgba(34,230,255,.22) 1px,transparent 1px) 0 0/100% 10%}
.disc{position:absolute;border-radius:50%;display:flex;align-items:center;justify-content:center;
  text-align:center;font-weight:900;color:#4b2f8f;line-height:1.15;
  background:url("sort3d/disc.webp") center/100% 100% no-repeat;
  transform:translate(-50%,-50%);cursor:grab;user-select:none;
  filter:drop-shadow(0 8px 16px rgba(0,0,0,.55));
  text-shadow:0 1px 0 rgba(255,255,255,.45)}
.disc.sel{filter:drop-shadow(0 0 12px var(--cyan)) drop-shadow(0 8px 16px rgba(0,0,0,.55))}
.disc.good{filter:drop-shadow(0 0 12px var(--lime)) drop-shadow(0 8px 16px rgba(0,0,0,.55))}
.disc span{display:block;padding:0 8%}
#title{position:absolute;left:0;right:0;text-align:center;font-weight:900;color:#5b3fa8;
  white-space:nowrap;transform:translateY(-50%);pointer-events:none}
#meta{position:absolute;left:0;right:0;text-align:center;font-weight:800;color:#5b3fa8;opacity:.7;
  transform:translateY(-50%);pointer-events:none}
#clock{position:absolute;transform:translate(-50%,-50%);border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-weight:900;
  border:6px solid #6e4baf;color:#3b2570;background:rgba(255,255,255,.35);
  filter:drop-shadow(0 8px 13px rgba(58,31,120,.4));pointer-events:none}
#svg{position:absolute;inset:0;pointer-events:none;z-index:4;overflow:visible}
@media(max-width:900px){
  body{flex-direction:column}
  #panel{width:100%;height:44%;border-inline-start:0;border-top:1px solid var(--line);order:2}
  #wrap{height:56%;order:1;padding:8px}
}
</style>
</head>
<body>

<div id="wrap">
  <div id="stage">
    <img id="bg" alt="">
    <div id="screen">
      <svg id="svg"></svg>
      <div id="title">اربط كل حيوان بصوته</div>
      <div id="meta">15 / 1</div>
      <div id="clock">46</div>
    </div>
  </div>
</div>

<div id="panel">
  <h1>🔗 مختبر لعبة التوصيل</h1>

  <div class="grp">
    <h2>الجهاز والعرض</h2>
    <div class="seg" id="devSeg">
      <button data-dev="d">🖥 كمبيوتر</button>
      <button data-dev="m">📱 جوال</button>
    </div>
    <div class="seg" id="rowSeg">
      <button data-rows="2">صفّان</button>
      <button data-rows="3">٣ صفوف</button>
      <button data-rows="4">٤ صفوف</button>
      <button data-rows="5">٥ صفوف</button>
    </div>
    <label class="chk"><input type="checkbox" id="showGrid"> إظهار الشبكة</label>
    <label class="chk"><input type="checkbox" id="longTxt"> نصوصٌ طويلة (اختبار الامتلاء)</label>
  </div>

  <div class="grp">
    <h2>الأقراص</h2>
    <div class="f"><label>القطر</label><div class="vv"><input type="range" id="dS" min="8" max="60" step=".5"><output id="dSo"></output></div></div>
    <div class="f"><label>العمود الأيسر (الأهداف)</label><div class="vv"><input type="range" id="cA" min="0" max="100" step=".5"><output id="cAo"></output></div></div>
    <div class="f"><label>العمود الأيمن (المصادر)</label><div class="vv"><input type="range" id="cB" min="0" max="100" step=".5"><output id="cBo"></output></div></div>
    <div class="f"><label>أول صفّ</label><div class="vv"><input type="range" id="rT" min="0" max="100" step=".5"><output id="rTo"></output></div></div>
    <div class="f"><label>المسافة</label><div class="vv"><input type="range" id="rG" min="4" max="60" step=".5"><output id="rGo"></output></div></div>
    <div class="f"><label>حجم الخط</label><div class="vv"><input type="range" id="fS" min="6" max="30" step=".5"><output id="fSo"></output></div></div>
    <div class="note">اسحب أيّ قرصٍ بالماوس لتضبط عموده وصفّه مباشرةً.</div>
  </div>

  <div class="grp">
    <h2>السؤال والعدّاد</h2>
    <div class="f"><label>ارتفاع السؤال</label><div class="vv"><input type="range" id="tY" min="-20" max="100" step=".5"><output id="tYo"></output></div></div>
    <div class="f"><label>حجم السؤال</label><div class="vv"><input type="range" id="tS" min="10" max="46" step=".5"><output id="tSo"></output></div></div>
    <div class="f"><label>ارتفاع العدّاد</label><div class="vv"><input type="range" id="mY" min="0" max="120" step=".5"><output id="mYo"></output></div></div>
    <div class="f"><label>حجم العدّاد</label><div class="vv"><input type="range" id="mS" min="8" max="34" step=".5"><output id="mSo"></output></div></div>
  </div>

  <div class="grp">
    <h2>القياسات</h2>
    <button class="btn gold" id="copyB">📋 انسخ القياسات</button>
    <button class="btn" id="mirrorB">↔ اشتقّ الجوال من الحاسوب</button>
    <button class="btn" id="resetB">↺ استعد الافتراضي</button>
    <textarea id="out" readonly spellcheck="false"></textarea>
    <div class="note">انسخها وأرسلها لي، أُثبّتها في اللعبة كما هي.</div>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
/* المسرح بنسبة الجهاز، والخلفية خلفيةُ التصنيف تملأه (cover) — كما في اللعبة */
const IMG={d:{f:"sort3d/bg.webp",ar:16/9}, m:{f:"sort3d/bg.webp",ar:9/16}};

/* الافتراضي — نقطةُ بدءٍ لا أكثر، أنت تضبطها */
const DEF={
  d:{dS:21.5,cA:25,cB:75,rT:30,rG:26,fS:15, tY:20,tS:29, mY:95,mS:13},
  m:{dS:14,  cA:22,cB:78,rT:27,rG:22,fS:19, tY:13,tS:19, mY:95,mS:12}
};
const LS="linkLab5";
let DEV="d", ROWS=3;
let S=JSON.parse(JSON.stringify(DEF));
try{ const v=JSON.parse(localStorage.getItem(LS)||"null");
     if(v&&v.d&&v.m){ ["d","m"].forEach(k=>Object.keys(DEF[k]).forEach(p=>{
       if(typeof v[k][p]==="number") S[k][p]=v[k][p]; }));
       if(v.dev) DEV=v.dev; if(v.rows) ROWS=v.rows; } }catch(e){}

const WORDS_S=[["ثغاء","نعيق","مواء","زئير","صهيل"],["الحمار","الغراب","القطة","الأسد","الحصان"]];
const WORDS_L=[["ثغاء الخراف في المرعى","نعيق الغراب عند الفجر","مواء القطة الجائعة","زئير الأسد المدوّي","صهيل الحصان العربي"],
               ["الخروف الصغير","الغراب الأسود","القطة الشيرازية","الأسد الأفريقي","الحصان العربي الأصيل"]];

function P(){ return S[DEV]; }

function fitStage(){
  const w=$("wrap").getBoundingClientRect(), I=IMG[DEV];
  let H=w.height-24, W=H*I.ar;
  if(W>w.width-24){ W=w.width-24; H=W/I.ar; }
  $("stage").style.width=W+"px"; $("stage").style.height=H+"px";
  return {W,H};
}

function place(){
  const {W,H}=fitStage(), I=IMG[DEV];
  const bg=$("bg");
  if(!bg.src.endsWith(I.f)) bg.src=I.f;
  bg.style.left="0"; bg.style.top="0"; bg.style.width=W+"px"; bg.style.height=H+"px";
  bg.style.objectFit="cover";
  const sc=$("screen");
  sc.style.left="0"; sc.style.top="0"; sc.style.width=W+"px"; sc.style.height=H+"px";
  sc.classList.toggle("grid",$("showGrid").checked);
  return {SW:W,SH:H};
}
function draw(){
  const {SW,SH}=place(), p=P();
  const sc=$("screen");
  [...sc.querySelectorAll(".disc")].forEach(e=>e.remove());
  const D=p.dS/100*SH;
  const W=($("longTxt").checked?WORDS_L:WORDS_S);
  for(let col=0;col<2;col++){
    const cx=(col===0?p.cA:p.cB)/100*SW;
    for(let i=0;i<ROWS;i++){
      const cy=(p.rT+p.rG*i)/100*SH;
      const d=document.createElement("div");
      d.className="disc"+(i===1&&col===0?" sel":"")+(i===0&&col===1?" good":"");
      d.style.width=D+"px"; d.style.height=D+"px";
      d.style.left=cx+"px"; d.style.top=cy+"px";
      d.style.fontSize=(p.fS/100*D)+"px";
      d.innerHTML="<span>"+W[col][i%5]+"</span>";
      d.dataset.col=col; d.dataset.row=i;
      d.onpointerdown=e=>dragDisc(e,d);
      sc.appendChild(d);
    }
  }
  const t=$("title");
  t.style.top=(p.tY/100*SH)+"px"; t.style.fontSize=p.tS+"px";
  const m=$("meta");
  m.style.top=(p.mY/100*SH)+"px"; m.style.fontSize=p.mS+"px";
  const k=$("clock"), kd=(DEV==="m"?58:120);
  k.style.width=kd+"px"; k.style.height=kd+"px";
  k.style.left="50%"; k.style.top=(DEV==="m"?5.5:11)+"%";
  k.style.fontSize=(kd*0.28)+"px";
  /* خطٌّ بين قرصين لمعاينة شكل الوصل */
  const svg=$("svg");
  svg.setAttribute("viewBox","0 0 "+SW+" "+SH);
  const x1=p.cA/100*SW, x2=p.cB/100*SW, y1=(p.rT+p.rG)/100*SH, y2=p.rT/100*SH;
  svg.innerHTML='<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+
    '" stroke="rgba(34,230,255,.85)" stroke-width="4" stroke-linecap="round"/>';
  sync();
}

/* ── سحب قرص: يضبط عمودَه وصفَّه ── */
function dragDisc(e,d){
  e.preventDefault();
  const sc=$("screen").getBoundingClientRect(), p=P();
  const col=+d.dataset.col, row=+d.dataset.row;
  const move=ev=>{
    const x=(ev.clientX-sc.left)/sc.width*100, y=(ev.clientY-sc.top)/sc.height*100;
    if(col===0) p.cA=Math.round(x*2)/2; else p.cB=Math.round(x*2)/2;
    if(row===0) p.rT=Math.round(y*2)/2;
    else{ const g=(y-p.rT)/row; if(g>3) p.rG=Math.round(g*2)/2; }
    draw(); save();
  };
  const up=()=>{document.removeEventListener("pointermove",move);
                document.removeEventListener("pointerup",up);};
  document.addEventListener("pointermove",move);
  document.addEventListener("pointerup",up);
}


const KEYS=["dS","cA","cB","rT","rG","fS","tY","tS","mY","mS"];
const UNIT={dS:"%",cA:"%",cB:"%",rT:"%",rG:"%",fS:"%",tY:"%",tS:"px",mY:"%",mS:"px"};
function sync(){
  const p=P();
  KEYS.forEach(k=>{ const el=$(k); if(el&&el.value!=String(p[k])) el.value=p[k];
                    const o=$(k+"o"); if(o) o.textContent=p[k]+UNIT[k]; });
  [...$("devSeg").children].forEach(b=>b.classList.toggle("on",b.dataset.dev===DEV));
  [...$("rowSeg").children].forEach(b=>b.classList.toggle("on",+b.dataset.rows===ROWS));
  $("out").value=JSON.stringify({d:S.d,m:S.m},null,1);
}
KEYS.forEach(k=>{ const el=$(k); if(el) el.oninput=()=>{ P()[k]=+el.value; draw(); save(); }; });
[...$("devSeg").children].forEach(b=>b.onclick=()=>{DEV=b.dataset.dev;draw();save();});
[...$("rowSeg").children].forEach(b=>b.onclick=()=>{ROWS=+b.dataset.rows;draw();save();});
$("showGrid").onchange=draw; $("longTxt").onchange=draw;
$("copyB").onclick=()=>{ $("out").select(); document.execCommand("copy");
  $("copyB").textContent="✓ نُسخت"; setTimeout(()=>$("copyB").textContent="📋 انسخ القياسات",1400); };
$("mirrorB").onclick=()=>{ const d=S.d;
  ["cA","cB","rT","rG","fS","tY","mY"].forEach(k=>S.m[k]=d[k]);
  S.m.dS=Math.round(d.dS*0.65*2)/2;   /* الجوال أطول فالقطر نسبةً من الارتفاع أصغر */
  /* المقاسات بالبكسل تُصغَّر: شاشة الجوال أضيق */
  S.m.tS=Math.round(d.tS*0.8*2)/2; S.m.mS=Math.round(d.mS*0.85*2)/2;
  draw(); save(); };
$("resetB").onclick=()=>{ if(!confirm("استعادة القياسات الافتراضية؟"))return;
  S=JSON.parse(JSON.stringify(DEF)); draw(); save(); };
function save(){ try{ localStorage.setItem(LS,JSON.stringify({d:S.d,m:S.m,dev:DEV,rows:ROWS})); }catch(e){} }

addEventListener("resize",draw);
$("bg").onload=draw;
draw();
</script>
</body>
</html>
