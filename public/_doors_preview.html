<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8">
<style>
/* ══════════════════════════════════════════
   نظام التصميم
   ══════════════════════════════════════════ */
:root{
  --cyan:#22e6ff; --magenta:#ff2f8e; --violet:#8b5cf6; --gold:#ffcb2e;
  --lime:#39e08a; --red:#ff4d5e; --orange:#ff8a3d;
  --ink:#f2f6ff; --dim:#94a3c4;
  --glass:rgba(255,255,255,.055);
  --stroke:rgba(255,255,255,.11);
  --blur:blur(22px) saturate(150%);
  --ease:cubic-bezier(.22,1,.36,1);
  --spring:cubic-bezier(.34,1.56,.44,1);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{
  font-family:'Segoe UI',Tahoma,Arial,sans-serif;
  background:#05070f;color:var(--ink);
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit}
.hide{display:none!important}

/* ── الخلفية الحيّة ── */
#bgFx{position:fixed;inset:0;z-index:0;pointer-events:none}
#aurora{position:fixed;inset:-25%;z-index:0;pointer-events:none;filter:blur(70px);opacity:.75}
.blob{position:absolute;border-radius:50%;mix-blend-mode:screen;will-change:transform}
.b1{width:46vmax;height:46vmax;background:radial-gradient(circle,#3b1e7a,transparent 68%);top:-8%;right:-6%;animation:drift1 24s ease-in-out infinite}
.b2{width:40vmax;height:40vmax;background:radial-gradient(circle,#0d4e6e,transparent 68%);bottom:-12%;left:-8%;animation:drift2 30s ease-in-out infinite}
.b3{width:32vmax;height:32vmax;background:radial-gradient(circle,#6d1247,transparent 70%);top:38%;left:32%;animation:drift3 26s ease-in-out infinite}
@keyframes drift1{0%,100%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(-8vmax,7vmax,0) scale(1.16)}}
@keyframes drift2{0%,100%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(9vmax,-6vmax,0) scale(1.2)}}
@keyframes drift3{0%,100%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(6vmax,8vmax,0) scale(.85)}}
#grid{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.16;
  background-image:linear-gradient(rgba(120,180,255,.14) 1px,transparent 1px),linear-gradient(90deg,rgba(120,180,255,.14) 1px,transparent 1px);
  background-size:46px 46px;
  mask-image:radial-gradient(ellipse 70% 55% at 50% 45%,#000 25%,transparent 78%);
  -webkit-mask-image:radial-gradient(ellipse 70% 55% at 50% 45%,#000 25%,transparent 78%)}

/* ── زجاج ── */
.glass{
  background:var(--glass);
  backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  border:1px solid var(--stroke);
  border-radius:22px;
  box-shadow:0 20px 60px -20px rgba(0,0,0,.75), inset 0 1px 0 rgba(255,255,255,.10);
}
.glow-c{box-shadow:0 0 0 1px rgba(34,230,255,.35),0 0 34px -6px rgba(34,230,255,.45)}

/* ══════════ الردهة ══════════ */
#lobby{position:relative;z-index:2;height:100dvh;overflow-y:auto;display:flex;flex-direction:column;align-items:center;gap:16px;padding:30px 16px 46px}
.logo{text-align:center;margin-bottom:2px}
.logo .mark{
  font-size:clamp(38px,9vw,62px);font-weight:900;letter-spacing:-2px;line-height:1;
  background:linear-gradient(100deg,#fff 8%,var(--cyan) 34%,var(--violet) 62%,var(--magenta) 92%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  background-size:220% auto;animation:sheen 7s linear infinite;
  filter:drop-shadow(0 0 26px rgba(139,92,246,.4))}
@keyframes sheen{to{background-position:220% center}}
.logo .sub{margin-top:9px;color:var(--dim);font-size:14.5px;letter-spacing:.3px}
.logo .back{display:inline-block;margin-top:12px;color:var(--cyan);font-size:12.5px;text-decoration:none;opacity:.85}

.panel{width:100%;max-width:452px;padding:24px}
.panel h3{font-size:15px;margin-bottom:14px;color:var(--dim);font-weight:700;letter-spacing:.4px}
.fi{position:relative;margin-bottom:11px}
.fi input{width:100%;padding:14px 16px;border-radius:14px;font-size:15px;color:var(--ink);
  background:rgba(255,255,255,.045);border:1.5px solid var(--stroke);transition:.22s var(--ease)}
.fi input:focus{outline:none;border-color:var(--cyan);background:rgba(34,230,255,.07);
  box-shadow:0 0 0 4px rgba(34,230,255,.11)}
.fi input::placeholder{color:#6b7a9c}

.btn{position:relative;overflow:hidden;width:100%;padding:14px;border-radius:14px;font-size:15.5px;font-weight:800;color:#04121a;
  background:linear-gradient(100deg,var(--cyan),#5ee7ff 50%,var(--violet));
  background-size:200% auto;transition:.28s var(--ease);
  box-shadow:0 10px 30px -10px rgba(34,230,255,.55)}
.btn:hover{background-position:100% center;transform:translateY(-2px);box-shadow:0 16px 38px -10px rgba(34,230,255,.7)}
.btn:active{transform:translateY(0) scale(.985)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn.ghost{background:rgba(255,255,255,.07);color:var(--ink);border:1.5px solid var(--stroke);box-shadow:none}
.btn.ghost:hover{background:rgba(255,255,255,.13);box-shadow:none}
.btn::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.6),transparent 65%);
  transform:translateX(-130%)}
.btn:hover::after{animation:swipe .75s var(--ease)}
@keyframes swipe{to{transform:translateX(130%)}}

.seg{display:flex;gap:5px;padding:5px;border-radius:15px;background:rgba(255,255,255,.045);border:1px solid var(--stroke);margin-bottom:15px}
.seg button{flex:1;padding:10px;border-radius:11px;font-size:13.5px;font-weight:700;color:var(--dim);transition:.25s var(--ease)}
.seg button.on{color:#04121a;background:linear-gradient(100deg,var(--cyan),var(--violet));box-shadow:0 6px 18px -6px rgba(34,230,255,.6)}
.err{color:var(--red);font-size:13px;min-height:18px;margin-top:8px}
.dim{color:var(--dim);font-size:13px}
.row{display:flex;gap:9px}.row>*{flex:1}

.rm{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:14px;background:rgba(255,255,255,.04);
  border:1px solid var(--stroke);margin-bottom:7px;font-size:13.5px;transition:.2s var(--ease)}
.rm:hover{background:rgba(255,255,255,.08);transform:translateX(-3px)}
.rm .g{flex:1;color:var(--dim)}
.rm b{color:var(--cyan)}
.rm button{padding:7px 15px;border-radius:10px;background:linear-gradient(100deg,var(--cyan),var(--violet));color:#04121a;font-weight:800;font-size:12.5px}

/* ══════════ اللعب ══════════ */
#game{position:relative;z-index:2;display:none;height:100dvh;flex-direction:column;padding:9px}

#hud{display:flex;align-items:center;gap:8px;padding:8px 12px;margin-bottom:9px;border-radius:16px;flex-shrink:0}
#hud .rid{font-size:13px;font-weight:800;letter-spacing:.6px}
#hud .rid b{color:var(--cyan)}
#hud .sp{flex:1}
.chip{font-size:11px;padding:5px 11px;border-radius:99px;background:rgba(255,255,255,.07);border:1px solid var(--stroke);font-weight:700;color:var(--dim)}
.ic{width:34px;height:34px;border-radius:11px;background:rgba(255,255,255,.06);border:1px solid var(--stroke);
  display:inline-flex;align-items:center;justify-content:center;font-size:14px;transition:.22s var(--ease)}
.ic:hover{background:rgba(34,230,255,.16);border-color:rgba(34,230,255,.45);transform:translateY(-2px)}

/* شريط اللاعبين */
#roster{display:flex;gap:8px;padding:2px 2px 10px;overflow-x:auto;flex-shrink:0;scrollbar-width:none}
#roster::-webkit-scrollbar{display:none}
.pl{position:relative;flex:0 0 auto;width:86px;padding:9px 8px 8px;border-radius:16px;text-align:center;
  background:rgba(255,255,255,.05);border:1.5px solid var(--stroke);
  transition:transform .5s var(--spring),border-color .3s,background .3s,box-shadow .3s}
.pl.me{background:rgba(34,230,255,.09);border-color:rgba(34,230,255,.38)}
.pl.ans{border-color:var(--lime);box-shadow:0 0 22px -6px rgba(57,224,138,.65)}
.pl.lead{border-color:var(--gold);box-shadow:0 0 26px -6px rgba(255,203,46,.6)}
.pl.off{opacity:.4;filter:grayscale(.7)}
.pl .av{width:38px;height:38px;margin:0 auto 5px;border-radius:13px;overflow:hidden;position:relative}
.pl .av svg{display:block;width:100%;height:100%}
.pl .nm{font-size:10.5px;font-weight:700;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl .sc{font-size:17px;font-weight:900;line-height:1.15;letter-spacing:-.5px}
.pl .crown{position:absolute;top:-9px;inset-inline-start:50%;transform:translateX(50%);font-size:14px;
  filter:drop-shadow(0 2px 6px rgba(255,203,46,.8));animation:bob 2.4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateX(50%) translateY(0)}50%{transform:translateX(50%) translateY(-3px)}}
.pop{position:absolute;top:2px;inset-inline-end:6px;font-size:12.5px;font-weight:900;color:var(--lime);
  animation:popUp 1.5s var(--ease) forwards;pointer-events:none;text-shadow:0 0 12px rgba(57,224,138,.9)}
@keyframes popUp{0%{transform:translateY(8px) scale(.5);opacity:0}22%{transform:translateY(-3px) scale(1.25);opacity:1}100%{transform:translateY(-30px) scale(.95);opacity:0}}
.zap{position:absolute;inset:0;border-radius:16px;pointer-events:none;
  box-shadow:0 0 0 0 rgba(255,47,142,.9);animation:zapRing .7s var(--ease)}
@keyframes zapRing{0%{box-shadow:0 0 0 0 rgba(255,47,142,.85)}100%{box-shadow:0 0 0 26px rgba(255,47,142,0)}}

/* المسرح */
#stage{position:relative;flex:1;min-height:0;border-radius:24px;overflow:hidden}
.scene{position:absolute;inset:0;display:none;flex-direction:column;padding:16px;overflow:hidden}
.scene.on{display:flex;animation:sceneIn .5s var(--ease)}
@keyframes sceneIn{from{opacity:0;transform:scale(.975) translateY(10px)}to{opacity:1;transform:none}}
.eyebrow{text-align:center;font-size:11.5px;font-weight:800;letter-spacing:2.2px;color:var(--cyan);
  text-transform:uppercase;margin-bottom:4px;opacity:.85}

/* المؤقت */
#clock{position:relative;width:88px;height:88px;margin:2px auto 10px;flex-shrink:0}
#clock svg{position:absolute;inset:0;transform:rotate(-90deg);overflow:visible}
#cTrack{fill:none;stroke:rgba(255,255,255,.09);stroke-width:6}
#cArc{fill:none;stroke:url(#cg);stroke-width:6;stroke-linecap:round;filter:drop-shadow(0 0 8px rgba(34,230,255,.9))}
#cNum{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:29px;font-weight:900;letter-spacing:-1.5px}
#clock.hot #cNum{color:var(--red);animation:beat .45s infinite}
#clock.hot #cArc{filter:drop-shadow(0 0 14px rgba(255,77,94,1))}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.14)}}
#clock .halo{position:absolute;inset:-14px;border-radius:50%;border:1px solid rgba(34,230,255,.22);animation:halo 2.4s ease-out infinite}
@keyframes halo{0%{transform:scale(.85);opacity:.8}100%{transform:scale(1.28);opacity:0}}

/* السؤال */
#qMeta{text-align:center;font-size:11.5px;color:var(--dim);margin-bottom:9px;font-weight:700}
#qMeta .tag{padding:3px 10px;border-radius:99px;background:rgba(139,92,246,.18);border:1px solid rgba(139,92,246,.4);color:#c4b5fd;margin-inline-start:6px}
#qText{font-size:clamp(18px,4.8vw,27px);font-weight:900;text-align:center;line-height:1.55;
  margin-bottom:16px;letter-spacing:-.4px;
  animation:qDrop .6s var(--spring) both}
@keyframes qDrop{from{opacity:0;transform:perspective(700px) rotateX(-32deg) translateY(-22px)}to{opacity:1;transform:none}}

#answers{display:grid;gap:10px;margin-top:auto}
@media(min-width:620px){#answers{grid-template-columns:1fr 1fr}}
.ans{position:relative;overflow:hidden;padding:17px 16px;border-radius:17px;font-size:16px;font-weight:800;text-align:center;
  background:rgba(255,255,255,.05);border:1.5px solid var(--stroke);
  transition:transform .2s var(--spring),border-color .25s,background .25s,box-shadow .25s;
  animation:ansIn .5s var(--spring) both}
.ans:nth-child(1){animation-delay:.06s}.ans:nth-child(2){animation-delay:.13s}
.ans:nth-child(3){animation-delay:.20s}.ans:nth-child(4){animation-delay:.27s}
@keyframes ansIn{from{opacity:0;transform:translateY(22px) scale(.94)}to{opacity:1;transform:none}}
.ans .key{position:absolute;inset-inline-start:13px;top:50%;transform:translateY(-50%);
  width:24px;height:24px;border-radius:8px;background:rgba(255,255,255,.09);
  font-size:12px;font-weight:900;display:flex;align-items:center;justify-content:center;color:var(--dim)}
.ans:hover{transform:translateY(-3px);border-color:rgba(34,230,255,.5);background:rgba(34,230,255,.08);
  box-shadow:0 14px 34px -14px rgba(34,230,255,.6)}
.ans:active{transform:scale(.975)}
.ans.pick{border-color:var(--cyan);background:rgba(34,230,255,.14);box-shadow:0 0 0 3px rgba(34,230,255,.18),0 0 30px -8px rgba(34,230,255,.7)}
.ans.pick .key{background:var(--cyan);color:#04121a}
.ans.win{border-color:var(--lime);background:rgba(57,224,138,.16);box-shadow:0 0 42px -8px rgba(57,224,138,.85);animation:winPulse .6s var(--spring)}
.ans.lose{border-color:var(--red);background:rgba(255,77,94,.13);animation:noShake .45s}
.ans.fade{opacity:.32;filter:saturate(.3)}
@keyframes winPulse{0%{transform:scale(1)}45%{transform:scale(1.045)}100%{transform:scale(1)}}
@keyframes noShake{0%,100%{transform:translateX(0)}18%{transform:translateX(-9px)}55%{transform:translateX(8px)}80%{transform:translateX(-4px)}}
.ans .flash{position:absolute;inset:0;background:linear-gradient(105deg,transparent 32%,rgba(255,255,255,.75),transparent 68%);transform:translateX(-135%)}
.ans.win .flash{animation:swipe .8s .08s var(--ease)}

/* ══════ التصويت: بوابات الفئات ══════ */
#voteHead{text-align:center;font-size:clamp(16px,3.6vw,23px);font-weight:900;margin-bottom:2px;letter-spacing:-.3px;
  background:linear-gradient(100deg,#fff,var(--cyan) 50%,#fff);-webkit-background-clip:text;background-clip:text;color:transparent;
  background-size:200% auto;animation:sheen 5s linear infinite}
#votes{display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(6px,1.4vw,16px);
  align-items:end;flex:1;min-height:0;padding:6px 2px 2px}
@media(max-width:640px){#votes{grid-template-columns:repeat(2,1fr);gap:10px;align-items:center}}

.door{position:relative;display:flex;flex-direction:column;align-items:center;gap:7px;
  background:none;padding:0;transition:transform .3s var(--spring);
  animation:doorIn .6s var(--spring) both}
.door:nth-child(1){animation-delay:.05s}.door:nth-child(2){animation-delay:.13s}
.door:nth-child(3){animation-delay:.21s}.door:nth-child(4){animation-delay:.29s}
@keyframes doorIn{from{opacity:0;transform:translateY(34px) scale(.9)}to{opacity:1;transform:none}}
.door:hover{transform:translateY(-8px) scale(1.03)}
.door:active{transform:translateY(-2px) scale(.99)}

.dHalo{position:absolute;left:50%;top:44%;width:118%;height:70%;transform:translate(-50%,-50%);
  border-radius:50%;background:radial-gradient(ellipse,var(--c1),transparent 66%);
  filter:blur(26px);opacity:.32;transition:opacity .35s;pointer-events:none;z-index:0}
.door:hover .dHalo{opacity:.7}
.door.on .dHalo{opacity:.95;animation:haloPulse 1.9s ease-in-out infinite}
@keyframes haloPulse{0%,100%{opacity:.75;transform:translate(-50%,-50%) scale(1)}50%{opacity:1;transform:translate(-50%,-50%) scale(1.09)}}

/* القوس */
.dArch{position:relative;z-index:1;width:100%;aspect-ratio:1/1.34;
  border-radius:50% 50% 12px 12px / 40% 40% 8px 8px;
  background:linear-gradient(165deg,var(--c1),var(--c2) 55%,var(--c3));
  padding:clamp(6px,1.1vw,11px);
  box-shadow:0 16px 34px -12px rgba(0,0,0,.85), inset 0 2px 0 rgba(255,255,255,.4), inset 0 -3px 8px rgba(0,0,0,.5);
  transition:box-shadow .35s,filter .35s}
.door:hover .dArch{box-shadow:0 22px 44px -12px rgba(0,0,0,.9), 0 0 40px -8px var(--c1), inset 0 2px 0 rgba(255,255,255,.5)}
.door.on .dArch{filter:saturate(1.25) brightness(1.1);
  box-shadow:0 0 0 3px var(--cyan), 0 0 52px -6px var(--cyan), 0 18px 36px -12px rgba(0,0,0,.9)}
/* اللوح الداخلي الغائر */
.dPanel{position:absolute;inset:clamp(6px,1.1vw,11px);border-radius:inherit;overflow:hidden;
  background:radial-gradient(ellipse at 50% 22%,rgba(255,255,255,.14),transparent 62%),
             linear-gradient(180deg,rgba(6,10,20,.62),rgba(3,6,14,.9));
  box-shadow:inset 0 6px 18px rgba(0,0,0,.8);
  background-size:cover;background-position:center}
.dPanel.hasArt{background-blend-mode:normal}
/* خط الباب المزدوج */
.dSeam{position:absolute;left:50%;top:22%;bottom:6%;width:1.5px;transform:translateX(-50%);
  background:linear-gradient(180deg,transparent,rgba(255,255,255,.32),transparent);pointer-events:none}
/* الأيقونات */
.dIcons{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3%}
.dIcons .big{font-size:clamp(26px,4.4vw,48px);line-height:1;filter:drop-shadow(0 4px 12px rgba(0,0,0,.75))}
.dIcons .pair{display:flex;gap:clamp(8px,1.8vw,20px)}
.dIcons .pair span{font-size:clamp(15px,2.5vw,27px);line-height:1;filter:drop-shadow(0 3px 8px rgba(0,0,0,.7));
  animation:iconFloat 3.4s ease-in-out infinite}
.dIcons .pair span:nth-child(2){animation-delay:1.1s}
@keyframes iconFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
/* حجر القمة والحرف */
.dKey{position:absolute;top:2%;left:50%;transform:translateX(-50%);z-index:3;
  width:clamp(20px,3.2vw,32px);height:clamp(20px,3.2vw,32px);border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-weight:900;
  font-size:clamp(11px,1.7vw,16px);color:#1a1205;
  background:linear-gradient(160deg,#ffe9a3,var(--gold) 55%,#c98f0c);
  box-shadow:0 3px 10px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.8)}
/* أعمدة جانبية */
.dArch::before,.dArch::after{content:"";position:absolute;bottom:0;width:9%;height:44%;
  background:linear-gradient(90deg,rgba(255,255,255,.22),rgba(0,0,0,.28));border-radius:3px 3px 0 0;z-index:2}
.dArch::before{left:-3%}.dArch::after{right:-3%}

.dName{font-size:clamp(12px,1.9vw,17px);font-weight:900;text-align:center;line-height:1.3;
  text-shadow:0 2px 10px rgba(0,0,0,.85);z-index:1}
.dVotes{position:relative;z-index:1;font-size:11.5px;font-weight:800;padding:3px 12px;border-radius:99px;
  background:rgba(255,255,255,.08);border:1px solid var(--stroke);color:var(--dim);
  display:flex;align-items:center;gap:5px;transition:.3s}
.door.on .dVotes{background:rgba(34,230,255,.16);border-color:rgba(34,230,255,.5);color:var(--cyan)}
.dVotes b{color:#fff;font-variant-numeric:tabular-nums}
/* شريط تعبئة الأصوات */
.dBar{position:absolute;inset:0;border-radius:99px;background:linear-gradient(90deg,var(--c1),var(--cyan));
  opacity:.28;transform-origin:right;transform:scaleX(0);transition:transform .6s var(--ease)}

/* أضواء عائمة بين الأبواب */
#voteOrbs{position:absolute;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.orb{position:absolute;border-radius:50%;filter:blur(1px);animation:orbFloat linear infinite}
@keyframes orbFloat{from{transform:translateY(20px);opacity:0}
  15%{opacity:.85}85%{opacity:.85}to{transform:translateY(-120px);opacity:0}}

/* الهجوم */
#atkTargets{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:9px;margin-bottom:12px}
.tg{padding:12px 10px;border-radius:15px;background:rgba(255,255,255,.05);border:1.5px solid var(--stroke);
  font-weight:800;font-size:13.5px;transition:.24s var(--ease);display:flex;align-items:center;gap:8px;justify-content:center}
.tg .av{width:26px;height:26px;border-radius:9px;overflow:hidden;flex-shrink:0}
.tg:hover{transform:translateY(-3px);border-color:rgba(255,47,142,.55)}
.tg.on{border-color:var(--magenta);background:rgba(255,47,142,.15);box-shadow:0 0 28px -8px rgba(255,47,142,.85)}
#atkPowers{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.pwr{position:relative;width:64px;padding:11px 6px;border-radius:15px;background:rgba(255,255,255,.05);
  border:1.5px solid var(--stroke);text-align:center;transition:.24s var(--spring)}
.pwr .em{font-size:22px;display:block;line-height:1.1}
