<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- أيقونة «فكّ الشفرة» للصفحة الرئيسيّة بستايل المارشميلو: بطاقتا الفريقين
       (زرقاءُ يسارًا ووردية يمينًا) مروحيّتين خلف قفلٍ لافندريٍّ ممتلئ، على
       وجهه ثلاثُ خاناتِ شفرةٍ باستيليّة بنقاطٍ **مرسومة** (٣ ثمّ ١ ثمّ ٤) لا
       أرقامٍ مكتوبة — المحارفُ يختلف رسمُها بين الأجهزة. حدودٌ بيضاءُ عريضة،
       مرسومةٌ من الصفر بلا شعارٍ ولا علامة. -->
  <defs>
    <linearGradient id="dB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EAF3FF"/><stop offset="1" stop-color="#A9C9F5"/>
    </linearGradient>
    <linearGradient id="dP" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFEEF4"/><stop offset="1" stop-color="#F7B3C9"/>
    </linearGradient>
    <linearGradient id="dL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F3EDFF"/><stop offset="1" stop-color="#BFA4F0"/>
    </linearGradient>
    <linearGradient id="dS" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#D9CBF2"/>
    </linearGradient>
    <filter id="dsh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.6" flood-color="#000" flood-opacity=".28"/>
    </filter>
  </defs>

  <g filter="url(#dsh)">
    <!-- بطاقتا الفريقين خلف القفل -->
    <g transform="rotate(-20 64 136)">
      <rect x="40" y="26" width="40" height="56" rx="10" fill="url(#dB)" stroke="#fff" stroke-width="5"/>
      <circle cx="50" cy="36" r="3.2" fill="#fff" opacity=".75"/>
    </g>
    <g transform="rotate(20 64 136)">
      <rect x="48" y="26" width="40" height="56" rx="10" fill="url(#dP)" stroke="#fff" stroke-width="5"/>
      <circle cx="58" cy="36" r="3.2" fill="#fff" opacity=".75"/>
    </g>

    <!-- حلقةُ القفل -->
    <path d="M44 66 V54 a20 20 0 0 1 40 0 V66" fill="none" stroke="#fff" stroke-width="16" stroke-linecap="round"/>
    <path d="M44 66 V54 a20 20 0 0 1 40 0 V66" fill="none" stroke="url(#dS)" stroke-width="9" stroke-linecap="round"/>

    <!-- جسمُ القفل -->
    <rect x="22" y="62" width="84" height="54" rx="17" fill="url(#dL)" stroke="#fff" stroke-width="6"/>
    <ellipse cx="44" cy="72" rx="13" ry="4" fill="#fff" opacity=".55"/>

    <!-- خاناتُ الشفرة: ٣ ثمّ ١ ثمّ ٤ نقاط -->
    <rect x="31" y="77" width="20" height="26" rx="7" fill="#FFE7B3" stroke="#fff" stroke-width="3.5"/>
    <circle cx="36.5" cy="83.5" r="2.4" fill="#C9850E"/>
    <circle cx="41" cy="90" r="2.4" fill="#C9850E"/>
    <circle cx="45.5" cy="96.5" r="2.4" fill="#C9850E"/>

    <rect x="54" y="77" width="20" height="26" rx="7" fill="#FFD9E4" stroke="#fff" stroke-width="3.5"/>
    <circle cx="64" cy="90" r="2.8" fill="#D95C84"/>

    <rect x="77" y="77" width="20" height="26" rx="7" fill="#D2F4E5" stroke="#fff" stroke-width="3.5"/>
    <circle cx="82.5" cy="84" r="2.4" fill="#2A9A70"/>
    <circle cx="91.5" cy="84" r="2.4" fill="#2A9A70"/>
    <circle cx="82.5" cy="96" r="2.4" fill="#2A9A70"/>
    <circle cx="91.5" cy="96" r="2.4" fill="#2A9A70"/>
  </g>
</svg>
