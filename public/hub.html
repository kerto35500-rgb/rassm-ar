<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ألعابنا — العب مع أصحابك</title>
<meta name="description" content="مجموعة ألعاب عربية جماعية تلعبها مع أصحابك من الجوال أو الكمبيوتر">
<style>
  :root{
    --ink:#0d1f33; --card:#ffffff;
    --muted:#8b97a8; --line:#e8edf3;
  }
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Tahoma,Arial,sans-serif;-webkit-tap-highlight-color:transparent}
  body{
    min-height:100dvh;color:#eaf1fb;
    background:
      radial-gradient(900px 500px at 85% -8%, rgba(229,84,30,.20), transparent 60%),
      radial-gradient(800px 460px at 8% 8%, rgba(30,136,229,.24), transparent 60%),
      linear-gradient(165deg,#0f2740 0%,#16375a 55%,#122f4d 100%);
    background-attachment:fixed;
    display:flex;flex-direction:column;align-items:center;
    padding:34px 16px 30px;
  }

  /* ===== الترويسة ===== */
  header{text-align:center;max-width:620px;margin-bottom:8px}
  .logo{font-size:clamp(34px,8.5vw,54px);font-weight:900;letter-spacing:-1px;line-height:1.1}
  .logo em{font-style:normal;color:#ffd54f}
  .tag{margin-top:10px;font-size:clamp(14px,3.6vw,17px);opacity:.72;line-height:1.7}
  .live{
    display:inline-flex;align-items:center;gap:7px;margin-top:14px;
    padding:6px 14px;border-radius:999px;font-size:13px;font-weight:700;
    background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.14);
  }
  .dot{width:8px;height:8px;border-radius:50%;background:#3ddc84;box-shadow:0 0 0 0 rgba(61,220,132,.7);animation:beat 1.8s infinite}
  .dot.off{background:#8b97a8;animation:none;box-shadow:none}
  @keyframes beat{0%{box-shadow:0 0 0 0 rgba(61,220,132,.6)}70%{box-shadow:0 0 0 8px rgba(61,220,132,0)}100%{box-shadow:0 0 0 0 rgba(61,220,132,0)}}

  /* ===== الشبكة ===== */
  .grid{
    width:100%;max-width:940px;margin-top:26px;
    display:grid;grid-template-columns:repeat(auto-fill,minmax(275px,1fr));gap:16px;
  }

  .g{
    position:relative;overflow:hidden;text-decoration:none;color:var(--ink);
    background:var(--card);border-radius:18px;padding:22px 20px 20px;
    display:flex;flex-direction:column;gap:9px;
    box-shadow:0 8px 26px rgba(0,0,0,.20);
    transition:transform .18s cubic-bezier(.2,.8,.3,1), box-shadow .18s;
  }
  .g:hover{transform:translateY(-5px);box-shadow:0 16px 38px rgba(0,0,0,.30)}
  .g:active{transform:translateY(-2px)}
  .g .bar{position:absolute;inset:0 0 auto 0;height:5px}
  .g .ic{
    width:54px;height:54px;border-radius:15px;display:flex;align-items:center;justify-content:center;
    font-size:29px;margin-bottom:2px;
  }
  .g h2{font-size:20px;font-weight:900;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .g p{font-size:13.8px;line-height:1.75;color:#5b6a7d}
  .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:3px}
  .t{font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:999px;background:#f1f5f9;color:#64748b}
  .foot{margin-top:auto;padding-top:14px;display:flex;align-items:center;gap:10px}
  .go{
    flex:1;text-align:center;padding:11px;border-radius:11px;color:#fff;font-weight:800;font-size:14.5px;
  }
  .now{font-size:12px;font-weight:800;color:var(--muted);white-space:nowrap;display:flex;align-items:center;gap:5px}
  .now b{color:#3ddc84}

  /* ألوان لكل لعبة */
  .c-blue  .bar{background:linear-gradient(90deg,#1e88e5,#64b5f6)}
  .c-blue  .ic{background:#e7f2fe;color:#1565c0}
  .c-blue  .go{background:#1e88e5}
  .c-fire  .bar{background:linear-gradient(90deg,#e5541e,#ff9066)}
  .c-fire  .ic{background:#ffefe8;color:#d8420b}
  .c-fire  .go{background:#e5541e}
  .c-green .bar{background:linear-gradient(90deg,#2e9e5b,#7fd6a0)}
  .c-green .ic{background:#e7f7ee;color:#1e7a44}
  .c-green .go{background:#2e9e5b}
  .c-violet .bar{background:linear-gradient(90deg,#7c4dff,#b39ddb)}
  .c-violet .ic{background:#f0eaff;color:#5b2bd9}
  .c-violet .go{background:#7c4dff}

  /* بطاقة "قريباً" */
  .g.soon{
    background:rgba(255,255,255,.055);border:2px dashed rgba(255,255,255,.2);
    box-shadow:none;color:#cfdcec;cursor:default;
  }
  .g.soon:hover{transform:none;box-shadow:none}
  .g.soon .ic{background:rgba(255,255,255,.09);color:#cfdcec}
  .g.soon p{color:rgba(234,241,251,.6)}
  .g.soon .t{background:rgba(255,255,255,.1);color:#cfdcec}
  .g.soon .go{background:rgba(255,255,255,.13);color:#cfdcec}
  .badge{font-size:10.5px;font-weight:800;padding:3px 9px;border-radius:999px;background:#ffd54f;color:#5a4200}

  footer{margin-top:32px;font-size:12.5px;opacity:.45;text-align:center;line-height:1.9}

  @media (max-width:560px){
    body{padding:26px 12px 24px}
    .grid{gap:13px;margin-top:20px}
    .g{padding:18px 16px 16px;border-radius:16px}
    .g .ic{width:46px;height:46px;font-size:25px;border-radius:13px}
    .g h2{font-size:18px}
    .g p{font-size:13.2px}
  }
</style>
</head>
<body>

  <header>
    <div class="logo">ألعاب<em>نا</em></div>
    <div class="tag">ألعاب جماعية عربية — افتح غرفة، أرسل الرابط لأصحابك، والعبوا من أي جهاز</div>
    <div class="live"><span class="dot off" id="dot"></span><span id="liveTxt">جاري التحقق…</span></div>
  </header>

  <main class="grid" id="grid"></main>

  <footer>
    كل الألعاب مجانية · تعمل على الجوال والكمبيوتر<br>
    <span id="dictNote"></span>
  </footer>

<script>
(function(){
  "use strict";

  /* ══════════════════════════════════════════════════════
     لإضافة لعبة جديدة: أضف كائناً واحداً هنا فقط.
     key   = مفتاح الإحصائيات القادم من /api/status (أو null)
     href  = رابط اللعبة ('#' إذا لم تجهز بعد)
     soon  = true تعرضها كبطاقة "قريباً"
     color = c-blue | c-fire | c-green | c-violet
     ══════════════════════════════════════════════════════ */
  const GAMES = [
    {
      key:"draw", href:"/draw", color:"c-blue", icon:"🎨",
      title:"ارسمها!",
      desc:"واحد يرسم والباقي يخمّنون الكلمة. أدوات رسم كاملة، فئات كلمات، ومعرض للرسمات في نهاية الجولة.",
      tags:["رسم وتخمين","٢–١٢ لاعب","دردشة"]
    },
    {
      key:"bomb", href:"/bomb", color:"c-fire", icon:"💣",
      title:"القنبلة",
      desc:"القنبلة تدور بينكم! اكتب كلمة عربية فيها المقطع المطلوب قبل ما تنفجر، وإلا تخسر قلب.",
      tags:["سرعة بديهة","٢–١٦ لاعب","قاموس ٢٧٢ ألف كلمة"]
    },
    {
      key:"quiz", href:"/quiz2", color:"c-violet", icon:"🏆",
      title:"قمّة الهرم",
      desc:"أسئلة سريعة، تصويت على الفئات، واضرب خصومك بالثلج والغراء! والنهاية سباق تسلّق على هرم ثلاثي الأبعاد.",
      tags:["ثقافة وسرعة","٢–٨ لاعبين","قوى هجومية"],
      alt:{href:"/quiz", label:"النسخة الكلاسيكية"}
    },
    {
      key:null, href:"#", color:"c-green", icon:"🕵️", soon:true,
      title:"برا السالفة",
      desc:"كلكم تعرفون الكلمة إلا واحد… اكتشفوا الدخيل قبل ما يكتشف الكلمة.",
      tags:["خداع","٤–١٠ لاعبين"]
    }
  ];

  const grid = document.getElementById("grid");

  GAMES.forEach(g => {
    const el = document.createElement(g.soon ? "div" : "a");
    if (!g.soon) el.href = g.href;
    el.className = "g " + g.color + (g.soon ? " soon" : "");
    el.innerHTML =
      '<div class="bar"></div>' +
      '<div class="ic">' + g.icon + '</div>' +
      '<h2>' + g.title + (g.soon ? ' <span class="badge">قريباً</span>' : '') + '</h2>' +
      '<p>' + g.desc + '</p>' +
      '<div class="tags">' + g.tags.map(t => '<span class="t">' + t + '</span>').join('') + '</div>' +
      '<div class="foot">' +
        '<span class="go">' + (g.soon ? 'تحت التطوير' : 'ادخل اللعبة ←') + '</span>' +
        (g.key ? '<span class="now" data-k="' + g.key + '"></span>' : '') +
      '</div>';
    if (g.alt) {
      const a = document.createElement("a");
      a.href = g.alt.href;
      a.textContent = g.alt.label;
      a.style.cssText = "position:absolute;top:12px;inset-inline-start:12px;font-size:10.5px;font-weight:700;" +
        "padding:4px 9px;border-radius:99px;background:#eef2f7;color:#64748b;text-decoration:none;z-index:3";
      a.onclick = e => e.stopPropagation();
      el.appendChild(a);
    }
    grid.appendChild(el);
  });

  // ===== الإحصائيات المباشرة =====
  function refresh(){
    fetch("/api/status", { cache:"no-store" })
      .then(r => r.json())
      .then(d => {
        const total = d.total || 0;
        document.getElementById("dot").className = "dot" + (total ? "" : " off");
        document.getElementById("liveTxt").textContent =
          total ? (total === 1 ? "لاعب واحد متصل الآن" : total + " لاعب متصل الآن") : "لا أحد يلعب الآن — كن الأول!";
        document.querySelectorAll(".now").forEach(el => {
          const s = d[el.dataset.k];
          el.innerHTML = (s && s.online) ? "<b>" + s.online + "</b> يلعبون" : "";
        });
      })
      .catch(() => {
        document.getElementById("liveTxt").textContent = "العب الآن";
      });
  }
  refresh();
  setInterval(refresh, 15000);
})();
</script>
</body>
</html>
