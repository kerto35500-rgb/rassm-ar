<!doctype html>
<html lang="ar" dir="rtl"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>مختبر مشهد الفخاخ — قمّة الهرم</title>
<style>
:root{
  --bg:#070b16; --ink:#f4f6ff; --dim:#9aa6c4; --stroke:rgba(255,255,255,.14);
  --gold:#ffcb2e; --cyan:#22e6ff; --violet:#8b5cf6; --magenta:#ff2f8e;
  --spring:cubic-bezier(.2,1.35,.35,1); --ease:cubic-bezier(.2,.9,.3,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font-family:"Tajawal","Segoe UI",system-ui,sans-serif;overflow:hidden}

/* ═══ المسرح: الفيديو ثم الإطار الثابت ═══ */
#stage{position:relative;width:100%;height:100%;overflow:hidden;background:#000;
  margin-inline:auto;transition:width .3s var(--ease)}
/* في وضع الجوال نحصر المسرح في إطار ٩:١٦ ليكون القياس واقعيًّا على الحاسوب.
   النِّسب المئوية للمواضع تُحسب من مستطيل المسرح نفسه، فتنتقل كما هي إلى الهاتف. */
body.dev-m #stage{width:min(100%,calc(100vh * 9 / 16));
  box-shadow:0 0 0 1px rgba(255,255,255,.18),0 0 60px rgba(0,0,0,.9)}
#vid,#still{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
/* الصورة أرضية دائمة تحت الفيديو: لو تأخّر التحميل أو فشل، يرى اللاعب
   الإطار الأخير بدل شاشة سوداء. والفيديو فوقها يتلاشى عند انتهائه فينكشف
   الإطار نفسه تحته — انتقال غير محسوس لأن الصورتين متطابقتان. */
#still{z-index:0}
#vid{z-index:1;opacity:1;transition:opacity .3s}
#vid.done{opacity:0}

/* ═══ العدّاد — أربعة أشكال ═══ */
#clockWrap{position:absolute;z-index:5;cursor:grab;user-select:none;touch-action:none;
  display:flex;align-items:center;justify-content:center}
#clockWrap.drag{cursor:grabbing}
#clockWrap.lock{cursor:default}

/* شكل ١: قرص التلفزيون */
.ck1{position:relative;width:100%;height:100%;border-radius:50%;
  background:radial-gradient(circle at 34% 28%,#8a9099 0%,#4a5058 32%,#23272d 70%,#14171c 100%);
  box-shadow:inset -5px -6px 14px rgba(0,0,0,.85),inset 4px 4px 10px rgba(255,255,255,.18),
    0 10px 26px rgba(0,0,0,.65);
  display:flex;align-items:center;justify-content:center;border:3px solid rgba(255,255,255,.16)}
.ck1 .num{font-size:38%;font-weight:900;color:#fff;text-shadow:0 2px 6px #000;
  font-variant-numeric:tabular-nums;letter-spacing:-1px}
.ck1 .ticks{position:absolute;inset:6%}
.ck1 .ticks i{position:absolute;left:50%;top:0;width:2px;height:9%;
  background:rgba(255,255,255,.5);transform-origin:50% 560%;border-radius:2px}
.ck1 .ring{position:absolute;inset:-7%}
.ck1 .ring circle{fill:none;stroke-width:5;stroke-linecap:round}

/* شكل ٢: أنبوب CRT — خط مسح يهبط */
.ck2{position:relative;width:100%;height:100%;border-radius:14%/20%;overflow:hidden;
  background:linear-gradient(180deg,#0d2b24,#071913);
  border:3px solid rgba(140,180,160,.35);
  box-shadow:inset 0 0 34px rgba(0,255,180,.16),0 8px 24px rgba(0,0,0,.6)}
.ck2::before{content:"";position:absolute;inset:0;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.34) 0 2px,transparent 2px 4px)}
.ck2 .scan{position:absolute;left:0;right:0;height:16%;
  background:linear-gradient(180deg,transparent,rgba(120,255,200,.28),transparent);
  animation:scanDrop 2.6s linear infinite}
@keyframes scanDrop{from{top:-16%}to{top:100%}}
.ck2 .num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:44%;font-weight:900;color:#b8ffe0;font-variant-numeric:tabular-nums;
  text-shadow:0 0 12px rgba(90,255,190,.9),0 0 3px #000}

/* شكل ٣: شريط تحت الشاشة */
.ck3{position:relative;width:100%;height:100%;display:flex;align-items:center;
  justify-content:center;gap:10px;border-radius:99px;padding:0 6%;
  background:linear-gradient(180deg,rgba(20,26,40,.92),rgba(8,11,20,.92));
  border:2px solid rgba(255,255,255,.16);box-shadow:0 8px 22px rgba(0,0,0,.55)}
.ck3 .bar{flex:1;height:26%;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden}
.ck3 .bar i{display:block;height:100%;width:100%;border-radius:99px;
  background:linear-gradient(90deg,var(--cyan),var(--violet))}
.ck3 .num{font-size:42%;font-weight:900;font-variant-numeric:tabular-nums;color:#fff}

/* شكل ٤: أنبوب نيون */
.ck4{position:relative;width:100%;height:100%;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle,rgba(10,14,26,.9),rgba(6,9,18,.95));
  border:3px solid rgba(34,230,255,.55);
  box-shadow:0 0 26px rgba(34,230,255,.45),inset 0 0 26px rgba(34,230,255,.22)}
.ck4 .num{font-size:40%;font-weight:900;color:#dff8ff;font-variant-numeric:tabular-nums;
  text-shadow:0 0 14px rgba(34,230,255,.95)}
.ck4 .ring{position:absolute;inset:-8%}
.ck4 .ring circle{fill:none;stroke-width:4;stroke-linecap:round;stroke:var(--cyan);
  filter:drop-shadow(0 0 6px rgba(34,230,255,.9))}

/* شكل ٥: عدّاد اللعبة الأساسي (منقول كما هو من quiz2.html) */
.ck5{position:relative;width:100%;height:100%}
.ck5 svg.dial{position:absolute;inset:0;transform:rotate(-90deg);overflow:visible}
.ck5 .trk{fill:none;stroke:rgba(255,255,255,.09);stroke-width:6}
.ck5 .arc{fill:none;stroke:url(#cg5);stroke-width:6;stroke-linecap:round;
  filter:drop-shadow(0 0 8px rgba(34,230,255,.9))}
.ck5 .num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-size:33%;font-weight:900;letter-spacing:-1.5px;color:#fff}
.ck5 .halo{position:absolute;inset:-14px;border-radius:50%;
  border:1px solid rgba(34,230,255,.22);animation:halo 2.4s ease-out infinite}
@keyframes halo{0%{transform:scale(.85);opacity:.8}100%{transform:scale(1.28);opacity:0}}

/* ═══ النصّ ═══ */
#title{position:absolute;z-index:5;cursor:grab;user-select:none;touch-action:none;
  text-align:center;white-space:nowrap;font-weight:900;
  color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.9),0 0 22px rgba(34,230,255,.35)}
#title.drag{cursor:grabbing}
#title .grip{bottom:-15px}
/* أنماط النصّ الثلاثة */
.tt-glow #titleTxt{background:linear-gradient(90deg,var(--cyan),#fff 45%,var(--magenta));
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 2px 8px rgba(0,0,0,.9))}
.tt-plate #titleTxt{background:rgba(0,0,0,.55);padding:.28em .9em;border-radius:99px;
  border:1px solid rgba(255,255,255,.2);display:inline-block}
.tt-crt #titleTxt{color:#b8ffe0;text-shadow:0 0 14px rgba(90,255,190,.85),0 2px 4px #000;
  letter-spacing:.04em}

/* ═══ ظهور العدّاد والبطاقات بعد انتهاء الفيديو ═══
   الاثنان مخفيّان تمامًا أثناء المشهد ثم يدخلان بأنيميشن — فلا يشوّشان
   على الزوم ولا يظهران فوق شاشة لم تُفتح بعد. */
#clockWrap,#cards,#title{opacity:0;pointer-events:none}
#clockWrap.reveal,#cards.reveal,#title.reveal{opacity:1;pointer-events:auto}
/* أ · نبضة CRT: يتمدّد من خط أفقي كأن الشاشة أشعلته */
.rv-crt #clockWrap.reveal,.rv-crt #title.reveal{animation:crtIn .5s var(--spring) both}
.rv-crt #cards.reveal .card{animation:crtIn2 .5s var(--spring) both,
  cardFloat 4.2s ease-in-out infinite calc(var(--d) + .6s)}
@keyframes crtIn{0%{opacity:0;transform:translate(-50%,-50%) scaleY(.02) scaleX(1.3)}
  55%{opacity:1;transform:translate(-50%,-50%) scaleY(1.08) scaleX(.96)}
  100%{opacity:1;transform:translate(-50%,-50%) scale(1)}}
@keyframes crtIn2{0%{opacity:0;transform:scaleY(.02) scaleX(1.3)}
  55%{opacity:1;transform:scaleY(1.08) scaleX(.96)}
  100%{opacity:1;transform:rotate(var(--tilt))}}
/* ب · صعود ناعم من الأسفل */
.rv-rise #clockWrap.reveal,.rv-rise #title.reveal{animation:riseIn .55s var(--spring) both}
.rv-rise #cards.reveal .card{animation:riseCard .6s var(--spring) both,
  cardFloat 4.2s ease-in-out infinite calc(var(--d) + .7s)}
@keyframes riseIn{from{opacity:0;transform:translate(-50%,-30%) scale(.8)}
  to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
@keyframes riseCard{from{opacity:0;transform:translateY(60px) rotate(calc(var(--tilt)*2)) scale(.7)}
  to{opacity:1;transform:translateY(0) rotate(var(--tilt)) scale(1)}}
/* ج · قلب ثلاثي الأبعاد */
.rv-flip #clockWrap.reveal,.rv-flip #title.reveal{animation:riseIn .5s var(--spring) both}
.rv-flip #cards.reveal .card{animation:flipIn .65s var(--ease) both,
  cardFloat 4.2s ease-in-out infinite calc(var(--d) + .75s)}
@keyframes flipIn{from{opacity:0;transform:perspective(700px) rotateY(90deg) scale(.85)}
  to{opacity:1;transform:perspective(700px) rotateY(0) rotate(var(--tilt)) scale(1)}}
/* د · بلا أنيميشن — للمقارنة */
.rv-none #cards.reveal .card{animation:cardFloat 4.2s ease-in-out infinite var(--d)}

/* ═══ البطاقات ═══ */
#cards{position:absolute;z-index:4;display:flex;flex-wrap:wrap;
  align-items:center;justify-content:center;cursor:grab;user-select:none;touch-action:none}
#cards.drag{cursor:grabbing}
#cards.lock{cursor:default}
.card{position:relative;aspect-ratio:823/1178;border-radius:14px;flex:0 0 auto;overflow:visible;
  background:linear-gradient(160deg,var(--pc1),var(--pc2));
  box-shadow:0 10px 26px -6px rgba(0,0,0,.75),inset 0 0 0 2px rgba(255,255,255,.22);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4%;
  animation:cardFloat 4.2s ease-in-out infinite;transition:transform .2s var(--spring)}
/* صورة البطاقة من /cards/<id>.webp — وإلا يبقى الرسم البرمجي بديلًا */
.card img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block;
  filter:drop-shadow(0 10px 22px rgba(0,0,0,.7))}
/* الصورة تحمل إطارها وشفافيتها، فنرفع عنها خلفية العنصر وحدوده وظلّه */
.card.hasImg{background:none;box-shadow:none;border-radius:0}
.card.hasImg .em,.card.hasImg .lb,.card.hasImg .self{display:none}
.card:nth-child(1){--tilt:-11deg;--d:0s;animation-delay:var(--d)}
.card:nth-child(2){--tilt:7deg;--d:.09s;animation-delay:var(--d)}
.card:nth-child(3){--tilt:-6deg;--d:.18s;animation-delay:var(--d)}
.card:nth-child(4){--tilt:12deg;--d:.27s;animation-delay:var(--d)}
.card:nth-child(5){--tilt:-9deg;--d:.36s;animation-delay:var(--d)}
.card:nth-child(6){--tilt:5deg;--d:.45s;animation-delay:var(--d)}
@keyframes cardFloat{0%,100%{transform:translateY(0) rotate(var(--tilt))}
  50%{transform:translateY(-11px) rotate(calc(var(--tilt)*.55))}}
.card .em{font-size:190%;line-height:1;filter:drop-shadow(0 2px 5px rgba(0,0,0,.5))}
.card .lb{font-size:74%;font-weight:900;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.75);
  text-align:center;padding:0 6%;line-height:1.2}
.card .self{position:absolute;top:5%;font-size:56%;font-weight:800;
  background:rgba(0,0,0,.5);padding:2px 8px;border-radius:99px;color:#fff}

/* مقابض التحجيم */
.grip{position:absolute;left:50%;bottom:-11px;transform:translateX(-50%);
  width:52px;height:9px;border-radius:99px;background:rgba(255,255,255,.5);
  cursor:ns-resize;box-shadow:0 0 0 2px rgba(0,0,0,.5);display:none}
.showGrips .grip{display:block}
.hint{position:absolute;top:-24px;left:50%;transform:translateX(-50%);
  font-size:11px;font-weight:800;color:#fff;background:rgba(0,0,0,.6);
  padding:2px 9px;border-radius:99px;white-space:nowrap;display:none}
.showGrips .hint{display:block}

/* ═══ لوحة التحكم ═══ */
#panel{position:fixed;top:12px;inset-inline-start:12px;z-index:50;width:290px;
  background:rgba(8,11,20,.94);border:1px solid var(--stroke);border-radius:16px;
  padding:12px;backdrop-filter:blur(10px);box-shadow:0 14px 40px rgba(0,0,0,.6);
  max-height:calc(100vh - 24px);overflow:auto;font-size:13px}
#panel.min{width:auto;padding:8px 12px}
#panel.min .body{display:none}
#panel h3{margin:0 0 8px;font-size:14px;display:flex;align-items:center;gap:8px}
#panel h3 button{margin-inline-start:auto;background:none;border:0;color:var(--dim);
  cursor:pointer;font-size:16px}
.row{display:flex;align-items:center;gap:8px;margin:7px 0}
.row label{flex:0 0 74px;color:var(--dim);font-weight:700;font-size:12px}
.row input[type=range]{flex:1;accent-color:var(--violet)}
.row input[type=text]{flex:1;min-width:0;padding:6px 9px;border-radius:8px;
  border:1px solid var(--stroke);background:rgba(255,255,255,.06);color:var(--ink);
  font-family:inherit;font-size:12px;font-weight:700}
.row output{flex:0 0 46px;text-align:center;font-weight:900;font-size:12px}
.seg{display:flex;gap:5px;flex-wrap:wrap;margin:7px 0}
.seg button{flex:1;min-width:56px;padding:7px 4px;border-radius:9px;cursor:pointer;
  border:1px solid var(--stroke);background:rgba(255,255,255,.05);color:var(--ink);
  font-family:inherit;font-weight:800;font-size:12px}
.seg button.on{background:linear-gradient(135deg,var(--violet),var(--magenta));border-color:transparent}
.btn{width:100%;padding:9px;border-radius:10px;border:0;cursor:pointer;margin-top:7px;
  background:linear-gradient(135deg,var(--violet),var(--magenta));color:#fff;
  font-family:inherit;font-weight:900;font-size:13px}
.btn.alt{background:rgba(255,255,255,.09);color:var(--ink);border:1px solid var(--stroke)}
.note{color:var(--dim);font-size:11px;line-height:1.5;margin:8px 0 0}
#out{margin-top:8px;background:rgba(0,0,0,.5);border:1px solid var(--stroke);
  border-radius:9px;padding:8px;font:11px/1.6 ui-monospace,monospace;
  white-space:pre;direction:ltr;text-align:left;max-height:150px;overflow:auto;display:none}
#out.on{display:block}
</style></head><body>

<div id="stage">
  <video id="vid" playsinline muted preload="auto"></video>
  <img id="still" alt="">

  <div id="clockWrap">
    <div class="hint">اسحب لتحريك · المقبض للحجم</div>
    <div id="clockBox"></div>
    <div class="grip" data-for="clock"></div>
  </div>

  <div id="title">
    <div class="hint">اسحب لتحريك · المقبض للحجم</div>
    <span id="titleTxt">اختر بطاقتك الهجومية</span>
    <div class="grip" data-for="title"></div>
  </div>

  <div id="cards">
    <div class="hint">اسحب لتحريك · المقبض للحجم</div>
    <div class="grip" data-for="cards"></div>
  </div>
</div>

<div id="panel">
  <h3>🎛️ مختبر مشهد الفخاخ <button id="minB" type="button">−</button></h3>
  <div class="body">

    <div class="seg" id="devSeg">
      <button data-dev="d" class="on">💻 كومبيوتر</button>
      <button data-dev="m">📱 جوال</button>
    </div>

    <div class="seg" id="ckSeg">
      <button data-ck="1" class="on">قرص</button>
      <button data-ck="2">أنبوب</button>
      <button data-ck="3">شريط</button>
      <button data-ck="4">نيون</button>
      <button data-ck="5">اللعبة</button>
    </div>
    <div class="seg" id="rvSeg">
      <button data-rv="crt" class="on">نبضة CRT</button>
      <button data-rv="rise">صعود</button>
      <button data-rv="flip">قلب</button>
      <button data-rv="none">بلا</button>
    </div>

    <div class="row"><label>حجم العدّاد</label>
      <input type="range" id="ckS" min="50" max="260" value="163"><output id="ckSo"></output></div>
    <div class="row"><label>أفقي</label>
      <input type="range" id="ckX" min="0" max="100" value="44"><output id="ckXo"></output></div>
    <div class="row"><label>رأسي</label>
      <input type="range" id="ckY" min="0" max="100" value="23"><output id="ckYo"></output></div>

    <div class="row" style="margin-top:12px"><label>النصّ</label>
      <input type="text" id="ttTxt" value="اختر بطاقتك الهجومية"></div>
    <div class="seg" id="ttSeg">
      <button data-tt="glow" class="on">متدرّج</button>
      <button data-tt="plate">لوحة</button>
      <button data-tt="crt">فوسفوري</button>
    </div>
    <div class="row"><label>حجم النصّ</label>
      <input type="range" id="ttS" min="12" max="90" value="30"><output id="ttSo"></output></div>
    <div class="row"><label>أفقي</label>
      <input type="range" id="ttX" min="0" max="100" value="44"><output id="ttXo"></output></div>
    <div class="row"><label>رأسي</label>
      <input type="range" id="ttY" min="0" max="100" value="41"><output id="ttYo"></output></div>

    <div class="row" style="margin-top:12px"><label>حجم البطاقة</label>
      <input type="range" id="cdS" min="50" max="220" value="138"><output id="cdSo"></output></div>
    <div class="row"><label>تباعد</label>
      <input type="range" id="cdG" min="0" max="60" value="40"><output id="cdGo"></output></div>
    <div class="row"><label>عرض المنطقة</label>
      <input type="range" id="cdW" min="30" max="100" value="41"><output id="cdWo"></output></div>
    <div class="row"><label>أفقي</label>
      <input type="range" id="cdX" min="0" max="100" value="44"><output id="cdXo"></output></div>
    <div class="row"><label>رأسي</label>
      <input type="range" id="cdY" min="0" max="100" value="66"><output id="cdYo"></output></div>
    <div class="row"><label>عدد</label>
      <input type="range" id="cdN" min="1" max="6" value="3"><output id="cdNo"></output></div>

    <button class="btn" id="playB" type="button">▶ أعد تشغيل المشهد</button>
    <button class="btn alt" id="gripB" type="button">إظهار مقابض السحب</button>
    <button class="btn alt" id="copyB" type="button">📋 انسخ القياسات</button>
    <div id="out"></div>
    <p class="note">اسحب العدّاد أو البطاقات مباشرةً على الشاشة، أو استعمل الأشرطة.
      القياسات نِسَبية فتثبت على كل الأحجام.</p>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
const PW_EM={freeze:"❄️",gloop:"🟢",bombs:"💣",nibble:"👾",double:"✨",bet:"🎲"};
const PW_NM={freeze:"تجميد",gloop:"وحل",bombs:"قنابل",nibble:"أكلة الحروف",double:"مضاعفة",bet:"رهان"};
const PW_CL={freeze:["#7ee8ff","#2b6cff"],gloop:["#a8e063","#2f7d32"],
  bombs:["#ff9a5a","#b3261e"],nibble:["#c9a4ff","#5b21b6"],
  double:["#ffe36e","#ff8a00"],bet:["#ffcb2e","#ff2f8e"]};
const SELF=new Set(["double"]);
const ORDER=["freeze","gloop","bombs","nibble","double","bet"];

/* ═══ الحالة ═══ */
/* كل جهاز له قياساته الخاصّة: الشاشة الرأسية تحتاج بطاقات أصغر وصفًّا أضيق. */
const DEF={
  d:{ck:1,ckS:163,ckX:44,ckY:23,cdS:138,cdG:40,cdW:41,cdX:44,cdY:66,cdN:3,
     ttS:30,ttX:44,ttY:41},
  m:{ck:1,ckS:104,ckX:50,ckY:26,cdS:92,cdG:14,cdW:84,cdX:50,cdY:63,cdN:3,
     ttS:20,ttX:50,ttY:44}
};
const SHARED=["rv","tt","ttSt"];          /* لا تتغيّر بتغيّر الجهاز */
const MEDIA={d:{v:"/traps/intro.mp4",i:"/traps/end.webp"},
             m:{v:"/traps/intro-m.mp4",i:"/traps/end-m.webp"}};
const LS="trapLab";

/* التبويب الخلفي قد يبلّغ عن أبعاد صفرية قبل أوّل رسم، فنتحصّن بمصادر بديلة
   ونؤجّل الحكم لو كان القياس غير صالح. */
function sniffDev(){
  const W=innerWidth||document.documentElement.clientWidth||screen.width||0;
  const H=innerHeight||document.documentElement.clientHeight||screen.height||0;
  if(!W||!H)return null;
  return (W<760 || W<H) ? "m" : "d";
}
let AUTO=true;                       /* يبقى صحيحًا حتى يختار المستخدم بنفسه */
let DEV = sniffDev() || "d";
const BOX={d:{...DEF.d},m:{...DEF.m}};
const S={...DEF.d,rv:'crt',tt:'اختر بطاقتك الهجومية',ttSt:'glow'};
try{
  const raw=JSON.parse(localStorage.getItem(LS)||"{}");
  if(raw.d)Object.assign(BOX.d,raw.d);
  if(raw.m)Object.assign(BOX.m,raw.m);
  SHARED.forEach(k=>{ if(raw[k]!==undefined)S[k]=raw[k]; });
  if(raw.dev){DEV=raw.dev;AUTO=false;}
}catch(e){}
Object.assign(S,BOX[DEV]);

function stash(){ Object.keys(DEF[DEV]).forEach(k=>BOX[DEV][k]=S[k]); }
function setDev(k,auto){
  if(!auto)AUTO=false;
  if(k===DEV)return;
  stash(); DEV=k; Object.assign(S,BOX[DEV]);
  document.body.classList.toggle("dev-m",DEV==="m");
  still.src=MEDIA[DEV].i;
  drawClock(); drawCards(); apply(); playScene();
}

/* ═══ المشهد: الفيديو ثم تجميد الإطار الأخير ═══ */
const vid=$("vid"), still=$("still");
still.src=MEDIA[DEV].i;
document.body.classList.toggle("dev-m",DEV==="m");
/* العدّاد والبطاقات لا يظهران إلا بعد أن تُفتح الشاشة — أي عند انتهاء الفيديو */
function hideUI(){ ["clockWrap","cards","title"].forEach(i=>$(i).classList.remove("reveal")); }
function showUI(){
  /* إعادة تشغيل الأنيميشن: نزيل الصنف ونجبر إعادة التخطيط ثم نعيده */
  hideUI(); void $("cards").offsetWidth;
  ["clockWrap","cards","title"].forEach(i=>$(i).classList.add("reveal"));
  t0=Date.now();                    /* العدّاد يبدأ من ٦٠ لحظة الظهور */
}
let sceneT=null;
function playScene(){
  clearTimeout(sceneT); hideUI();
  vid.classList.remove("done");
  vid.src=MEDIA[DEV].v;
  vid.currentTime=0;
  vid.play().catch(()=>finishScene());
  /* صمّام أمان: لو تعذّر التشغيل خلال ٣ ثوانٍ نُظهر الواجهة على الإطار الثابت */
  sceneT=setTimeout(()=>{ if(vid.readyState<2)finishScene(); },3000);
}
function finishScene(){
  clearTimeout(sceneT);
  vid.classList.add("done");
  showUI();
}
vid.addEventListener("ended",finishScene);
vid.addEventListener("error",finishScene);
playScene();
$("playB").onclick=playScene;

/* ═══ العدّاد ═══ */
function clockHTML(k,n){
  if(k===1){
    let t="";for(let i=0;i<12;i++)t+='<i style="transform:translateX(-50%) rotate('+(i*30)+'deg)"></i>';
    return '<div class="ck1"><div class="ticks">'+t+'</div>'+
      '<svg class="ring" viewBox="0 0 100 100"><circle cx="50" cy="50" r="47" stroke="rgba(255,255,255,.12)"/>'+
      '<circle id="ckArc" cx="50" cy="50" r="47" stroke="url(#g1)" transform="rotate(-90 50 50)"/>'+
      '<defs><linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">'+
      '<stop offset="0" stop-color="#ffcb2e"/><stop offset="1" stop-color="#ff2f8e"/></linearGradient></defs></svg>'+
      '<span class="num">'+n+'</span></div>';
  }
  if(k===5) return '<div class="ck5"><div class="halo"></div>'+
      '<svg class="dial" viewBox="0 0 100 100">'+
      '<defs><linearGradient id="cg5" x1="0" y1="0" x2="1" y2="1">'+
      '<stop offset="0" stop-color="#22e6ff"/><stop offset=".5" stop-color="#8b5cf6"/>'+
      '<stop offset="1" stop-color="#ff2f8e"/></linearGradient></defs>'+
      '<circle class="trk" cx="50" cy="50" r="44"/>'+
      '<circle id="ckArc" class="arc" cx="50" cy="50" r="44"/></svg>'+
      '<span class="num">'+n+'</span></div>';
  if(k===2) return '<div class="ck2"><div class="scan"></div><span class="num">'+n+'</span></div>';
  if(k===3) return '<div class="ck3"><span class="num">'+n+'</span>'+
      '<span class="bar"><i id="ckBar"></i></span></div>';
  return '<div class="ck4">'+
      '<svg class="ring" viewBox="0 0 100 100"><circle cx="50" cy="50" r="47" stroke="rgba(34,230,255,.15)"/>'+
      '<circle id="ckArc" cx="50" cy="50" r="47" transform="rotate(-90 50 50)"/></svg>'+
      '<span class="num">'+n+'</span></div>';
}
let secs=60, t0=Date.now();
function tick(){
  const el=Date.now()-t0;
  secs=Math.max(0,60-Math.floor(el/1000));
  const frac=Math.max(0,1-el/60000);
  const num=$("clockBox").querySelector(".num");
  if(num)num.textContent=secs;
  const arc=document.getElementById("ckArc");
  if(arc){const R=S.ck===5?44:47, C=2*Math.PI*R;
    arc.style.strokeDasharray=C;arc.style.strokeDashoffset=C*(1-frac);}
  const bar=document.getElementById("ckBar");
  if(bar)bar.style.width=(frac*100)+"%";
  if(secs<=0)t0=Date.now();
  requestAnimationFrame(tick);
}
function drawClock(){ $("clockBox").innerHTML=clockHTML(S.ck,secs); }

/* ═══ البطاقات ═══ */
function drawCards(){
  const box=$("cards");
  [...box.querySelectorAll(".card")].forEach(e=>e.remove());
  ORDER.slice(0,S.cdN).forEach(p=>{
    const cl=PW_CL[p], d=document.createElement("div");
    d.className="card";
    d.style.setProperty("--pc1",cl[0]);d.style.setProperty("--pc2",cl[1]);
    d.innerHTML=(SELF.has(p)?'<span class="self">لنفسك</span>':(p==="bet"?'<span class="self">مراهنة</span>':''))+
      '<span class="em">'+PW_EM[p]+'</span><span class="lb">'+PW_NM[p]+'</span>';
    /* نجرّب الصورة: تنجح فتحلّ محلّ الرسم، وتفشل فيبقى الرسم كما هو */
    const im=new Image();
    im.onload=()=>{ d.insertBefore(im,d.firstChild); d.classList.add("hasImg"); };
    im.src="/cards/"+p+".webp";
    box.appendChild(d);
  });
}

/* ═══ التخطيط ═══ */
function apply(){
  const cw=$("clockWrap");
  cw.style.width=S.ckS+"px"; cw.style.height=S.ckS+"px";
  /* النِّسب المئوية في font-size تُحسب من الخط الموروث لا من ارتفاع العنصر،
     فنُثبّت أساسًا يساوي حجم العدّاد ليكبر الرقم معه فعلًا. */
  cw.style.fontSize=S.ckS+"px";
  cw.style.left=S.ckX+"%"; cw.style.top=S.ckY+"%";
  cw.style.transform="translate(-50%,-50%)";
  $("clockBox").style.cssText="width:100%;height:100%";

  const tt=$("title");
  tt.style.left=S.ttX+"%"; tt.style.top=S.ttY+"%";
  tt.style.transform="translate(-50%,-50%)";
  tt.style.fontSize=S.ttS+"px";
  $("titleTxt").textContent=S.tt;

  const cd=$("cards");
  cd.style.width=S.cdW+"%";
  cd.style.left=S.cdX+"%"; cd.style.top=S.cdY+"%";
  cd.style.transform="translate(-50%,-50%)";
  cd.style.gap=S.cdG+"px";
  cd.style.fontSize=(S.cdS*.22)+"px";
  [...cd.querySelectorAll(".card")].forEach(c=>{c.style.width=S.cdS+"px";});

  ["ckS","ckX","ckY","cdS","cdG","cdW","cdX","cdY","cdN","ttS","ttX","ttY"].forEach(k=>{
    const i=$(k); if(i)i.value=S[k];
    const o=$(k+"o"); if(o)o.textContent=S[k]+
      (["ckS","cdS","cdG","ttS"].includes(k)?"px":(k==="cdN"?"":"%"));
  });
  if($("ttTxt")&&$("ttTxt").value!==S.tt)$("ttTxt").value=S.tt;
  [...$("ttSeg").children].forEach(b=>b.classList.toggle("on",b.dataset.tt===S.ttSt));
  document.body.className=document.body.className.replace(/\btt-\w+/g,"").trim()+" tt-"+S.ttSt;
  [...$("devSeg").children].forEach(b=>b.classList.toggle("on",b.dataset.dev===DEV));
  [...$("ckSeg").children].forEach(b=>b.classList.toggle("on",+b.dataset.ck===S.ck));
  [...$("rvSeg").children].forEach(b=>b.classList.toggle("on",b.dataset.rv===S.rv));
  document.body.className=document.body.className.replace(/\brv-\w+/g,"").trim()+" rv-"+S.rv;
  stash();
  try{localStorage.setItem(LS,JSON.stringify(
    {dev:DEV,d:BOX.d,m:BOX.m,rv:S.rv,tt:S.tt,ttSt:S.ttSt}));}catch(e){}
  if($("out").classList.contains("on"))showOut();
}

/* ═══ الأشرطة ═══ */
["ckS","ckX","ckY","cdS","cdG","cdW","cdX","cdY","cdN","ttS","ttX","ttY"].forEach(k=>{
  $(k).oninput=e=>{ S[k]=+e.target.value; if(k==="cdN")drawCards(); apply(); };
});
$("ttTxt").oninput=e=>{ S.tt=e.target.value; apply(); };
[...$("ttSeg").children].forEach(b=>{ b.onclick=()=>{ S.ttSt=b.dataset.tt; apply(); }; });
[...$("devSeg").children].forEach(b=>{ b.onclick=()=>setDev(b.dataset.dev,false); });
/* لو حُمّلت الصفحة بأبعاد غير صالحة، نصحّح الوضع فور أوّل قياس حقيقي. */
addEventListener("resize",()=>{ if(!AUTO)return; const d=sniffDev(); if(d)setDev(d,true); });
requestAnimationFrame(()=>{ if(!AUTO)return; const d=sniffDev(); if(d&&d!==DEV)setDev(d,true); });
[...$("ckSeg").children].forEach(b=>{
  b.onclick=()=>{ S.ck=+b.dataset.ck; drawClock(); apply(); };
});
[...$("rvSeg").children].forEach(b=>{
  b.onclick=()=>{ S.rv=b.dataset.rv; apply(); showUI(); };
});

/* ═══ السحب المباشر ═══ */
function draggable(el,kx,ky){
  el.addEventListener("pointerdown",e=>{
    if(e.target.classList.contains("grip"))return;
    if(!document.body.classList.contains("showGrips"))return;
    e.preventDefault(); el.classList.add("drag");
    const R=$("stage").getBoundingClientRect();
    const mv=ev=>{
      S[kx]=Math.round(Math.min(100,Math.max(0,(ev.clientX-R.left)/R.width*100)));
      S[ky]=Math.round(Math.min(100,Math.max(0,(ev.clientY-R.top)/R.height*100)));
      apply();
    };
    const up=()=>{el.classList.remove("drag");
      document.removeEventListener("pointermove",mv);
      document.removeEventListener("pointerup",up);};
    document.addEventListener("pointermove",mv);
    document.addEventListener("pointerup",up);
  });
}
draggable($("clockWrap"),"ckX","ckY");
draggable($("cards"),"cdX","cdY");
draggable($("title"),"ttX","ttY");

document.querySelectorAll(".grip").forEach(g=>{
  g.addEventListener("pointerdown",e=>{
    e.preventDefault();e.stopPropagation();
    const key={clock:"ckS",cards:"cdS",title:"ttS"}[g.dataset.for];
    const LIM={ckS:[50,260],cdS:[50,220],ttS:[12,90]}[key];
    const y0=e.clientY, v0=S[key];
    const mv=ev=>{ S[key]=Math.max(LIM[0],Math.min(LIM[1],Math.round(v0+(ev.clientY-y0)))); apply(); };
    const up=()=>{document.removeEventListener("pointermove",mv);
      document.removeEventListener("pointerup",up);};
    document.addEventListener("pointermove",mv);
    document.addEventListener("pointerup",up);
  });
});

$("gripB").onclick=()=>{
  const on=document.body.classList.toggle("showGrips");
  $("gripB").textContent=on?"إخفاء مقابض السحب":"إظهار مقابض السحب";
};
$("minB").onclick=()=>{
  const p=$("panel"), m=p.classList.toggle("min");
  $("minB").textContent=m?"+":"−";
};
function blockOut(k,o){
  return (k==="d"?"💻 كومبيوتر":"📱 جوال")+"\n"+
"  clock: shape "+o.ck+" · size "+o.ckS+"px · x "+o.ckX+"% · y "+o.ckY+"%\n"+
"  cards: size "+o.cdS+"px · gap "+o.cdG+"px · area "+o.cdW+"% · x "+o.cdX+"% · y "+o.cdY+"% · count "+o.cdN+"\n"+
"  title: size "+o.ttS+"px · x "+o.ttX+"% · y "+o.ttY+"%\n";
}
function showOut(){
  stash();
  $("out").textContent=
"/* قياسات مشهد الفخاخ */\n"+
blockOut("d",BOX.d)+blockOut("m",BOX.m)+
"مشترك: reveal "+S.rv+" · نمط النصّ "+S.ttSt+"\n"+
"النصّ: \""+S.tt+"\"";
}
$("copyB").onclick=()=>{
  $("out").classList.add("on"); showOut();
  navigator.clipboard&&navigator.clipboard.writeText($("out").textContent);
  $("copyB").textContent="✓ نُسخت";
  setTimeout(()=>$("copyB").textContent="📋 انسخ القياسات",1400);
};

drawClock(); drawCards(); apply(); tick();
</script></body></html>
